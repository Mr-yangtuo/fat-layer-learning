478d4" stroke-width="2" /><text x="491" y="365" font-size="14" fill="#61758c" text-anchor="middle" font-weight="normal">40通道级的48通道投影</text><line x1="491" y1="370" x2="491" y2="382" stroke="#3478d4" stroke-width="2" /><text x="720" y="365" font-size="14" fill="#61758c" text-anchor="middle" font-weight="normal">24通道级的48通道投影</text><line x1="720" y1="370" x2="720" y2="382" stroke="#3478d4" stroke-width="2" /><rect x="30" y="565" width="410" height="98" rx="12" fill="#f3f7fb" stroke="#dbe5ef"/><text x="44" y="592" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">每个融合块：逐通道3×3 → 1×1混合</text><text x="44" y="616" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">→ GroupNorm(8组) → SiLU</text><text x="44" y="640" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">top 为48→48，后面三块为96→48。</text><rect x="468" y="565" width="482" height="134" rx="12" fill="#f1f8f5" stroke="#dbe5ef"/><text x="484" y="593" font-size="17" fill="#19324c" text-anchor="start" font-weight="bold">预测头：视觉48 + 行列位置2 = 50通道</text><text x="484" y="622" font-size="17" fill="#19324c" text-anchor="start" font-weight="normal">可分离卷积 50→48 → 1×1卷积 48→2</text><text x="484" y="651" font-size="17" fill="#259678" text-anchor="start" font-weight="normal">tanh 得到两个 64×64 的有符号竖直距离场</text><text x="484" y="680" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">坐标先在小场中解码，再横向插值到256列。</text><text x="30" y="730" font-size="14" fill="#61758c" text-anchor="start" font-weight="normal">教学示意；尺寸与公式来自源码，图中数值例子不代表实际预测。</text></svg>