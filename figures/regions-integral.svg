<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img"><title>区域积分：半格边界也能得到小数坐标</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#188c77"/></marker></defs><rect width="900" height="640" fill="white"/><text x="32" y="43" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#173e38" text-anchor="start">区域积分：半格边界也能得到小数坐标</text><text x="32" y="76" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">一列放大成 8 个格子；0.5 表示边界穿过其中半格。</text><text x="54" y="126" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">区域概率 R</text><text x="302" y="126" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">上方占比 1−R</text><text x="38" y="173" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">0</text><rect x="82" y="145" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="201" y="174" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><rect x="335" y="145" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="335" y="145" width="105" height="44" rx="0" fill="#c87929" stroke="#d6e4df"/><text x="454" y="174" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><text x="38" y="217" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">1</text><rect x="82" y="189" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="201" y="218" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><rect x="335" y="189" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="335" y="189" width="105" height="44" rx="0" fill="#c87929" stroke="#d6e4df"/><text x="454" y="218" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><text x="38" y="261" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">2</text><rect x="82" y="233" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="82" y="233" width="52.5" height="44" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="201" y="262" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0.5</text><rect x="335" y="233" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="335" y="233" width="52.5" height="44" rx="0" fill="#c87929" stroke="#d6e4df"/><text x="454" y="262" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0.5</text><text x="38" y="305" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">3</text><rect x="82" y="277" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="82" y="277" width="105" height="44" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="201" y="306" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="335" y="277" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="454" y="306" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><text x="38" y="349" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">4</text><rect x="82" y="321" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="82" y="321" width="105" height="44" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="201" y="350" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="335" y="321" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="454" y="350" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><text x="38" y="393" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">5</text><rect x="82" y="365" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="82" y="365" width="105" height="44" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="201" y="394" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="335" y="365" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="454" y="394" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><text x="38" y="437" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">6</text><rect x="82" y="409" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="82" y="409" width="105" height="44" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="201" y="438" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="335" y="409" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="454" y="438" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><text x="38" y="481" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">7</text><rect x="82" y="453" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><rect x="82" y="453" width="105" height="44" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="201" y="482" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="335" y="453" width="105" height="44" rx="0" fill="#f5f7f6" stroke="#d6e4df"/><text x="454" y="482" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">0</text><path d="M65 255L227 255" stroke="#c87929" stroke-width="3" fill="none" stroke-dasharray="6 4"/><text x="507" y="187" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">上方总量：1＋1＋0.5＝2.5</text><rect x="495" y="219" width="365" height="192" rx="9" fill="#fff0d9" stroke="#d6e4df"/><text x="518" y="260" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#173e38" text-anchor="start">u = 2.5 / 8 = 0.3125</text><text x="518" y="310" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">输入高度 H = 256</text><text x="518" y="357" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="start">ŷ = u × (H−1)</text><text x="518" y="393" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#173e38" text-anchor="start">   = 79.6875 像素</text><text x="40" y="548" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">同一公式也用于训练目标：格子完全在边界上方为 0，下方为 1。</text><text x="40" y="584" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">真实边界穿过某格时，按下方面积比例给出软值，积分可还原高度。</text><text x="32" y="616" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#56756b" text-anchor="start">示例为精确数值演示；模型实际区域图高通常为 64，输入高度为 256。</text></svg>