ont-weight="400" text-anchor="middle">7</text><rect x="765" y="214" width="45" height="44" rx="5" fill="#f0eaf9" stroke="#7d6bc4"/><text x="787" y="244" fill="#7d6bc4" font-size="19" font-weight="400" text-anchor="middle">8</text><rect x="585" y="280" width="45" height="44" rx="5" fill="#f0eaf9" stroke="#7d6bc4"/><text x="607" y="310" fill="#7d6bc4" font-size="19" font-weight="400" text-anchor="middle">9</text><rect x="645" y="280" width="45" height="44" rx="5" fill="#f0eaf9" stroke="#7d6bc4"/><text x="667" y="310" fill="#7d6bc4" font-size="19" font-weight="400" text-anchor="middle">10</text><rect x="705" y="280" width="45" height="44" rx="5" fill="#f0eaf9" stroke="#7d6bc4"/><text x="727" y="310" fill="#7d6bc4" font-size="19" font-weight="400" text-anchor="middle">11</text><rect x="765" y="280" width="45" height="44" rx="5" fill="#f0eaf9" stroke="#7d6bc4"/><text x="787" y="310" fill="#7d6bc4" font-size="19" font-weight="400" text-anchor="middle">12</text><text x="697" y="409" fill="#7d6bc4" font-size="19" font-weight="400" text-anchor="middle">每个查询是80维向量</text><path d="M246.875 240.0L607 171" fill="none" stroke="#7d6bc4" stroke-width="1" stroke-dasharray="3 3"/><path d="M325.625 240.0L607 171" fill="none" stroke="#7d6bc4" stroke-width="1" stroke-dasharray="3 3"/><path d="M351.875 270.0L607 171" fill="none" stroke="#7d6bc4" stroke-width="1" stroke-dasharray="3 3"/><path d="M378.125 210.0L607 171" fill="none" stroke="#7d6bc4" stroke-width="1" stroke-dasharray="3 3"/><text x="62" y="465" fill="#173e39" font-size="23" font-weight="600" text-anchor="start">一个查询的更新</text><rect x="50" y="489" width="800" height="95" rx="5" fill="#f5f8f5" stroke="#ccdcd6"/><text x="70" y="522" fill="#173e39" font-size="22" font-weight="400" text-anchor="start">相关性 → 对1024个位置的权重 → 加权汇总图像特征</text><text x="70" y="559" fill="#58746d" font-size="18" font-weight="400" text-anchor="start">q ← LayerNorm(q + Attention(q, memory, memory))；再做 q + FFN(q)</text><text x="62" y="614" fill="#7d6bc4" font-size="21" font-weight="400" text-anchor="start">重复两轮 · 4个头各看20维 · 最终仍是 [B,12,80]</text><text x="30" y="640" fill="#58746d" font-size="16" font-weight="400" text-anchor="start">教学示意 · 数值用于说明机制，不代表训练或测试结果</text></g></svg>