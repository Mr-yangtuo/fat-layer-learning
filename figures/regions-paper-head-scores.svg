<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-label="一个位置的 64 个特征，怎样变成两个区域概率"><title>一个位置的 64 个特征，怎样变成两个区域概率</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#168674"/></marker><linearGradient id="cy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6fafc"/><stop offset="1" stop-color="#367eaf"/></linearGradient><linearGradient id="cx"><stop offset="0" stop-color="#f6fafc"/><stop offset="1" stop-color="#367eaf"/></linearGradient></defs><rect width="960" height="800" fill="white"/><text x="32" y="44" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#173e38" text-anchor="start">一个位置的 64 个特征，怎样变成两个区域概率</text><text x="32" y="78" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c" text-anchor="start">先用 1×1 卷积算两个分数，再分别计算两种“位于边界下方”的概率。</text><text x="40" y="121" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#173e38" text-anchor="start">同一位置的 64 个特征数</text><rect x="40" y="163" width="53" height="51" fill="#e6f1eb" stroke="#168674" stroke-width="1" rx="0"/><text x="66.5" y="197" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="middle">f₁</text><rect x="93" y="163" width="53" height="51" fill="#e6f1eb" stroke="#168674" stroke-width="1" rx="0"/><text x="119.5" y="197" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="middle">f₂</text><rect x="146" y="163" width="53" height="51" fill="#e6f1eb" stroke="#168674" stroke-width="1" rx="0"/><text x="172.5" y="197" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="middle">…</text><rect x="199" y="163" width="53" height="51" fill="#e6f1eb" stroke="#168674" stroke-width="1" rx="0"/><text x="225.5" y="197" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="middle">f₆₃</text><rect x="252" y="163" width="53" height="51" fill="#e6f1eb" stroke="#168674" stroke-width="1" rx="0"/><text x="278.5" y="197" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="middle">f₆₄</text><text x="40" y="248" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#5b706c" text-anchor="start">一格里有 64 个数，</text><text x="40" y="280" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#5b706c" text-anchor="start">不是把 64 张图平均。</text><path d="M319 188H374V145H436" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><path d="M374 188V265H436" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="112" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#168674" text-anchor="start">第一组权重</text><rect x="450" y="125" width="44" height="42" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="0"/><text x="472" y="154" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#168674" text-anchor="middle">u₁</text><rect x="494" y="125" width="44" height="42" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="0"/><text x="516" y="154" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#168674" text-anchor="middle">u₂</text><rect x="538" y="125" width="44" height="42" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="0"/><text x="560" y="154" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#168674" text-anchor="middle">…</text><rect x="582" y="125" width="44" height="42" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="0"/><text x="604" y="154" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#168674" text-anchor="middle">u₆₃</text><rect x="626" y="125" width="44" height="42" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="0"/><text x="648" y="154" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#168674" text-anchor="middle">u₆₄</text><path d="M684 145H821" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="131" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#5b706c" text-anchor="middle">加权求和</text><rect x="835" y="120" width="83" height="53" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="7"/><text x="876" y="155" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" font-weight="600" fill="#168674" text-anchor="middle">a</text><text x="450" y="194" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#168674" text-anchor="start">a = u₁f₁ + … + u₆₄f₆₄ + 偏置1</text><text x="450" y="232" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#367eaf" text-anchor="start">第二组权重</text><rect x="450" y="245" width="44" height="42" fill="#e6eff8" stroke="#367eaf" stroke-width="1" rx="0"/><text x="472" y="274" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#367eaf" text-anchor="middle">v₁</text><rect x="494" y="245" width="44" height="42" fill="#e6eff8" stroke="#367eaf" stroke-width="1" rx="0"/><text x="516" y="274" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#367eaf" text-anchor="middle">v₂</text><rect x="538" y="245" width="44" height="42" fill="#e6eff8" stroke="#367eaf" stroke-width="1" rx="0"/><text x="560" y="274" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#367eaf" text-anchor="middle">…</text><rect x="582" y="245" width="44" height="42" fill="#e6eff8" stroke="#367eaf" stroke-width="1" rx="0"/><text x="604" y="274" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#367eaf" text-anchor="middle">v₆₃</text><rect x="626" y="245" width="44" height="42" fill="#e6eff8" stroke="#367eaf" stroke-width="1" rx="0"/><text x="648" y="274" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#367eaf" text-anchor="middle">v₆₄</text><path d="M684 265H821" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="251" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#5b706c" text-anchor="middle">加权求和</text><rect x="835" y="240" width="83" height="53" fill="#e6eff8" stroke="#367eaf" stroke-width="1" rx="7"/><text x="876" y="275" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" font-weight="600" fill="#367eaf" text-anchor="middle">b</text><text x="450" y="314" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#367eaf" text-anchor="start">b = v₁f₁ + … + v₆₄f₆₄ + 偏置2</text><text x="40" y="354" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c" text-anchor="start">每组都有自己的 64 个权重和 1 个偏置；同一组权重在所有 64×64 个位置共享。</text><path d="M32 378H928" fill="none" stroke="#c9dbd5" stroke-width="1"/><text x="40" y="416" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">只看这个位置的一个数值例</text><text x="40" y="446" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c" text-anchor="start">分数可以为负或为正；下面的 1.386 和 0 是教学示例。</text><rect x="40" y="475" width="160" height="61" fill="#f4f7f4" stroke="#c9dbd5" stroke-width="1" rx="7"/><text x="120" y="513" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#173e38" text-anchor="middle">a ≈ 1.386</text><path d="M213 505H357" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="491" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#5b706c" text-anchor="middle">sigmoid</text><rect x="40" y="595" width="160" height="61" fill="#f4f7f4" stroke="#c9dbd5" stroke-width="1" rx="7"/><text x="120" y="633" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#173e38" text-anchor="middle">b = 0</text><path d="M213 625H357" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="611" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#5b706c" text-anchor="middle">sigmoid</text><rect x="373" y="475" width="210" height="61" fill="#e3f2eb" stroke="#168674" stroke-width="1" rx="7"/><text x="478" y="514" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#168674" text-anchor="middle">上界下方概率 = 0.8</text><rect x="373" y="595" width="210" height="61" fill="#fff4e5" stroke="#dfb986" stroke-width="1" rx="7"/><text x="478" y="634" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#bd6b25" text-anchor="middle">中间门控 = 0.5</text><path d="M597 505H772" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 505V599" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><path d="M597 625H624" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><circle cx="650" cy="625" r="23" fill="white" stroke="#367eaf" stroke-width="2"/><text x="650" y="634" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29" font-weight="600" fill="#367eaf" text-anchor="middle">×</text><path d="M677 625H772" fill="none" stroke="#168674" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="682" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#bd6b25" text-anchor="middle">门控还要乘 0.8，才是下界下方概率</text><rect x="790" y="457" width="96" height="96" fill="#f6f8f6" stroke="#168674" stroke-width="1" rx="0"/><path d="M814.0 467V563" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M790 481.0H886" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M838.0 467V563" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M790 505.0H886" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M862.0 467V563" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M790 529.0H886" fill="none" stroke="#c9dbd5" stroke-width="1"/><rect x="814" y="481" width="24" height="24" fill="#dcefe6" stroke="#168674" stroke-width="2" rx="0"/><text x="895" y="495" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#168674" text-anchor="start">0.8</text><path d="M840 503H888" fill="none" stroke="#168674" stroke-width="1"/><text x="838" y="447" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#168674" text-anchor="middle">上界下方图</text><rect x="790" y="587" width="96" height="96" fill="#f6f8f6" stroke="#367eaf" stroke-width="1" rx="0"/><path d="M814.0 587V683" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M790 611.0H886" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M838.0 587V683" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M790 635.0H886" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M862.0 587V683" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M790 659.0H886" fill="none" stroke="#c9dbd5" stroke-width="1"/><rect x="814" y="611" width="24" height="24" fill="#dfedf7" stroke="#367eaf" stroke-width="2" rx="0"/><text x="895" y="625" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#367eaf" text-anchor="start">0.4</text><path d="M840 623H888" fill="none" stroke="#367eaf" stroke-width="1"/><text x="838" y="577" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#367eaf" text-anchor="middle">下界下方图</text><text x="40" y="730" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#367eaf" text-anchor="start">下界下方概率 = 0.8 × 0.5 = 0.4，因此总有 P下 ≤ P上。</text><text x="40" y="770" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c" text-anchor="start">两张图各为 64×64；这里标出同一个位置。两种概率不要求相加为 1，也不沿列做 softmax。</text></svg>