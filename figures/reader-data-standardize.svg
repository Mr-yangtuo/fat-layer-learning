<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" width="800" height="740" role="img"><title>标准化改变数值，不移动像素位置</title><rect width="800" height="740" fill="white"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="34" y="43" font-size="28" fill="#173c39" text-anchor="start" font-weight="600">标准化改变数值，不移动像素位置</text><text x="34" y="78" font-size="20" fill="#57736b" text-anchor="start" font-weight="400">小数组数例：PyTorch 默认样本标准差；忽略极小的 ε。</text><line x1="34" y1="101" x2="766" y2="101" stroke="#dce7df" stroke-width="1" /><text x="58" y="145" font-size="22" fill="#173c39" text-anchor="start" font-weight="600">除以 255 后</text><rect x="58" y="175" width="126" height="94" rx="5" fill="rgb(46,54,56)" stroke="none" /><text x="121" y="233" font-size="25" fill="white" text-anchor="middle" font-weight="400">0.2</text><rect x="188" y="175" width="126" height="94" rx="5" fill="rgb(92,100,102)" stroke="none" /><text x="251" y="233" font-size="25" fill="white" text-anchor="middle" font-weight="400">0.4</text><rect x="58" y="273" width="126" height="94" rx="5" fill="rgb(138,146,148)" stroke="none" /><text x="121" y="331" font-size="25" fill="#173c39" text-anchor="middle" font-weight="400">0.6</text><rect x="188" y="273" width="126" height="94" rx="5" fill="rgb(184,192,194)" stroke="none" /><text x="251" y="331" font-size="25" fill="#173c39" text-anchor="middle" font-weight="400">0.8</text><text x="442" y="145" font-size="22" fill="#173c39" text-anchor="start" font-weight="600">减均值、除以标准差后</text><rect x="442" y="175" width="126" height="94" rx="5" fill="#d9e9f2" stroke="none" /><text x="505" y="233" font-size="25" fill="#173c39" text-anchor="middle" font-weight="400">-1.162</text><rect x="572" y="175" width="126" height="94" rx="5" fill="#e7f0f2" stroke="none" /><text x="635" y="233" font-size="25" fill="#173c39" text-anchor="middle" font-weight="400">-0.387</text><rect x="442" y="273" width="126" height="94" rx="5" fill="#dfece3" stroke="none" /><text x="505" y="331" font-size="25" fill="#173c39" text-anchor="middle" font-weight="400">0.387</text><rect x="572" y="273" width="126" height="94" rx="5" fill="#a5cdb6" stroke="none" /><text x="635" y="331" font-size="25" fill="#173c39" text-anchor="middle" font-weight="400">1.162</text><text x="58" y="407" font-size="21" fill="#57736b" text-anchor="start" font-weight="400">均值 0.5；标准差约 0.2582</text><text x="442" y="407" font-size="21" fill="#57736b" text-anchor="start" font-weight="400">均值约 0；标准差约 1</text><rect x="34" y="437" width="732" height="82" rx="8" fill="#e5f1ec" stroke="none" /><text x="400" y="472" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">新值 = (原值 − 当前图像均值) / (标准差 + 10⁻⁷)</text><text x="400" y="502" font-size="20" fill="#57736b" text-anchor="middle" font-weight="400">数组的行、列和标注坐标保持原位</text><line x1="65" y1="648" x2="315" y2="648" stroke="#57736b" stroke-width="2" /><rect x="91" y="560" width="28" height="88" rx="3" fill="#147c6a" stroke="none" /><text x="105" y="675" font-size="18" fill="#57736b" text-anchor="middle" font-weight="400">0.2</text><rect x="146" y="560" width="28" height="88" rx="3" fill="#147c6a" stroke="none" /><text x="160" y="675" font-size="18" fill="#57736b" text-anchor="middle" font-weight="400">0.4</text><rect x="201" y="560" width="28" height="88" rx="3" fill="#dc9b53" stroke="none" /><text x="215" y="675" font-size="18" fill="#57736b" text-anchor="middle" font-weight="400">0.6</text><rect x="256" y="560" width="28" height="88" rx="3" fill="#dc9b53" stroke="none" /><text x="270" y="675" font-size="18" fill="#57736b" text-anchor="middle" font-weight="400">0.8</text><text x="65" y="548" font-size="20" fill="#173c39" text-anchor="start" font-weight="400">原值分布</text><line x1="446" y1="648" x2="696" y2="648" stroke="#57736b" stroke-width="2" /><rect x="472" y="560" width="28" height="88" rx="3" fill="#147c6a" stroke="none" /><text x="486" y="675" font-size="18" fill="#57736b" text-anchor="middle" font-weight="400">-1.2</text><rect x="5