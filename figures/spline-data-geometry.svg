x="680" y="155" width="180" height="245" rx="0" fill="#f4f8f5" stroke="#ccdcd6"/><path d="M710.0 155L710.0 400" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M740.0 155L740.0 400" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M770.0 155L770.0 400" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M800.0 155L800.0 400" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M830.0 155L830.0 400" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M680 190.0L860 190.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M680 225.0L860 225.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M680 260.0L860 260.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M680 295.0L860 295.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M680 330.0L860 330.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M680 365.0L860 365.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><polyline points="680.00,200.58 690.00,204.13 700.00,207.12 710.00,209.08 720.00,209.69 730.00,208.87 740.00,206.74 750.00,203.64 760.00,200.05 770.00,196.55 780.00,193.68 790.00,191.91 800.00,191.50 810.00,192.53 820.00,194.83 830.00,198.03 840.00,201.64 850.00,205.09 860.00,207.82" fill="none" stroke="#147d71" stroke-width="3"/><polyline points="680.00,291.74 690.00,295.29 700.00,298.28 710.00,300.24 720.00,300.86 730.00,300.03 740.00,297.90 750.00,294.80 760.00,291.21 770.00,287.71 780.00,284.84 790.00,283.07 800.00,282.66 810.00,283.69 820.00,285.99 830.00,289.20 840.00,292.81 850.00,296.25 860.00,298.98" fill="none" stroke="#c88039" stroke-width="3"/><text x="770" y="124" fill="#173e39" font-size="21" font-weight="400" text-anchor="middle">裁顶后拉伸</text><text x="770" y="438" fill="#147d71" font-size="16" font-weight="400" text-anchor="middle">y′ = (y−a)·H/(H−a)</text><text x="45" y="497" fill="#173e39" font-size="21" font-weight="400" text-anchor="start">先插值：原标注至少有2个有效列；首末点之外的列仍设无效。</text><text x="45" y="537" fill="#173e39" font-size="21" font-weight="400" text-anchor="start">再取视图：原图或固定裁剪版 → 缩放到256² → 坐标同步缩放。</text><text x="45" y="577" fill="#173e39" font-size="20" font-weight="400" text-anchor="start">训练增强：翻转/几何裁剪同步更新标签与有效性；亮度扰动不移坐标。</text><text x="45" y="621" fill="#58746d" font-size="19" font-weight="400" text-anchor="start">这些图是合成几何示意，不是测试集的真实超声图像。</text><text x="30" y="680" fill="#58746d" font-size="16" font-weight="400" text-anchor="start">教学示意 · 数值用于说明机制，不代表训练或测试结果</text></g></svg>