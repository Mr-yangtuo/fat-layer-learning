<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-labelledby="title desc"><title id="title">为什么加权平均不一定落在峰上</title><desc id="desc">两个高概率峰位于2和4，虚线平均位置位于3；下方对称配重的平衡支点也位于3，说明期望与最大峰不同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs><rect width="800" height="820" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="32" y="45" font-size="30" fill="#173c39" text-anchor="start" font-weight="600">为什么加权平均不一定落在峰上</text><text x="32" y="78" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">示意概率为 [0.02, 0.08, 0.35, 0.10, 0.35, 0.08, 0.02]。</text><text x="35" y="126" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">一列有两个较高的位置</text><path d="M80 170L80 410" stroke="#607a73" stroke-width="1.5" fill="none"/><path d="M80 410L730 410" stroke="#607a73" stroke-width="1.5" fill="none"/><text x="80" y="158" font-size="18" fill="#607a73" text-anchor="start" font-weight="400">概率</text><text x="730" y="475" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">行号 y（横轴仅为作图）</text><rect x="115" y="398.0" width="48" height="12.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="139" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">0</text><text x="139" y="378.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.02</text><rect x="205" y="362.0" width="48" height="48.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="229" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">1</text><text x="229" y="342.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.08</text><rect x="295" y="200.0" width="48" height="210.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="319" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">2</text><text x="319" y="180.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.35</text><rect x="385" y="350.0" width="48" height="60.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="409" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">3</text><text x="409" y="330.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.10</text><rect x="475" y="200.0" width="48" height="210.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="499" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">4</text><text x="499" y="180.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.35</text><rect x="565" y="362.0" width="48" height="48.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="589" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">5</text><text x="589" y="342.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.08</text><rect x="655" y="398.0" width="48" height="12.0" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="679" y="445" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">6</text><text x="679" y="378.0" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.02</text><path d="M409 160L409 420" stroke="#dc9b53" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="409" y="146" font-size="23" fill="#dc9b53" text-anchor="middle" font-weight="400">平均位置 = 3</text><text x="35" y="503" font-size="24" fill="#173c39" text-anchor="start" font-weight="400">最高的两个位置：第 2 行、第 4 行</text><text x="35" y="545" font-size="23" fill="#173c39" text-anchor="start" font-weight="400">概率加权平均：3；它不必落在最高峰上。</text><path d="M110 660L690 660" stroke="#173c39" stroke-width="5" fill="none"/><path d="M385 691L410 660L435 691Z" stroke="#173c39" stroke-width="2" fill="#e5f1ec"/><circle cx="140" cy="611.0" r="9.0" fill="#147c6a" stroke="none"/><path d="M140 620L140 658" stroke="#147c6a" stroke-width="2" fill="none"/><circle cx="230" cy="608.0" r="12.0" fill="#147c6a" stroke="none"/><path d="M230 620L230 658" stroke="#147c6a" stroke-width="2" fill="none"/><circle cx="320" cy="594.5" r="25.5" fill="#147c6a" stroke="none"/><path d="M320 620L320 658" stroke="#147c6a" stroke-width="2" fill="none"/><circle cx="410" cy="607.0" r="13.0" fill="#147c6a" stroke="none"/><path d="M410 620L410 658" stroke="#147c6a" stroke-width="2" fill="none"/><circle cx="500" cy="594.5" r="25.5" fill="#147c6a" stroke="none"/><path d="M500 620L500 658" stroke="#147c6a" stroke-width="2" fill="none"/><circle cx="590" cy="608.0" r="12.0" fill="#147c6a" stroke="none"/><path d="M590 620L590 658" stroke="#147c6a" stroke-width="2" fill="none"/><circle cx="680" cy="611.0" r="9.0" fill="#147c6a" stroke="none"/><path d="M680 620L680 658" stroke="#147c6a" stroke-width="2" fill="none"/><text x="410" y="733" font-size="23" fill="#173c39" text-anchor="middle" font-weight="400">像秤的平衡点：取决于全部位置及其权重</text><text x="35" y="785" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">热图监督约束分布形状，坐标损失只比较最后的高度。</text></g></svg>