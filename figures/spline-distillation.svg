<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img"><title>教师提供建议，人工标签决定建议的权重</title><rect width="900" height="660" fill="white"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="42" fill="#173e39" font-size="28" font-weight="700" text-anchor="start">教师提供建议，人工标签决定建议的权重</text><text x="30" y="75" fill="#58746d" font-size="18" font-weight="400" text-anchor="start">同一批、同一增强后的图像送入教师和学生；教师冻结</text><rect x="45" y="125" width="195" height="200" rx="0" fill="#f4f8f5" stroke="#ccdcd6"/><path d="M84.0 125L84.0 325" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M123.0 125L123.0 325" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M162.0 125L162.0 325" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M201.0 125L201.0 325" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M45 165.0L240 165.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M45 205.0L240 205.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M45 245.0L240 245.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><path d="M45 285.0L240 285.0" fill="none" stroke="#d4e3dc" stroke-width="1"/><polyline points="45.00,185.00 64.50,191.78 84.00,196.18 103.50,196.69 123.00,193.11 142.50,186.69 162.00,179.69 181.50,174.54 201.00,173.05 220.50,175.73 240.00,181.65" fill="none" stroke="#147d71" stroke-width="3"/><polyline points="45.00,260.00 64.50,266.78 84.00,271.18 103.50,271.69 123.00,268.11 142.50,261.69 162.00,254.69 181.50,249.54 201.00,248.05 220.50,250.73 240.00,256.65" fill="none" stroke="#c88039" stroke-width="3"/><text x="140" y="362" fill="#173e39" font-size="20" font-weight="400" text-anchor="middle">同一输入与标注</text><rect x="320" y="128" width="225" height="80" rx="5" fill="#e7f1ea" stroke="#147d71"/><text x="432" y="160" fill="#147d71" font-size="22" font-weight="400" text-anchor="middle">ResNet18 教师</text><text x="432" y="190" fill="#58746d" font-size="18" font-weight="400" text-anchor="middle">eval · 不更新