16像素：g≈0.135</text><text x="65" y="523" fill="#173e39" font-size="21" font-weight="400" text-anchor="start">蒸馏项 = 坐标 Smooth L1 + 0.5 × 区域 Bernoulli KL</text><text x="65" y="559" fill="#7d6bc4" font-size="20" font-weight="400" text-anchor="start">总训练损失再乘 0.424 × min(epoch/10,1) 加入蒸馏项。</text><text x="30" y="640" fill="#58746d" font-size="16" font-weight="400" text-anchor="start">教学示意 · 数值用于说明机制，不代表训练或测试结果</text></g></svg>