<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 790" width="800" height="790" role="img"><title>划分的是源文件身份，不是屏幕上的图块</title><rect width="800" height="790" fill="white"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="34" y="43" font-size="28" fill="#173c39" text-anchor="start" font-weight="600">划分的是源文件身份，不是屏幕上的图块</text><text x="34" y="78" font-size="20" fill="#57736b" text-anchor="start" font-weight="400">同一原图的裁剪版仍属于同一个源样本。</text><line x1="34" y1="101" x2="766" y2="101" stroke="#dce7df" stroke-width="1" /><text x="35" y="143" font-size="23" fill="#147c6a" text-anchor="start" font-weight="600">按目录完整分组：同一组只进入一边</text><rect x="47" y="185" width="210" height="155" rx="7" fill="white" stroke="#147c6a" /><rect x="53" y="172" width="82" height="26" rx="4" fill="#147c6a" stroke="none" /><text x="152" y="224" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">训练：组 A</text><rect x="68" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="91" y="266" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">a1</text><rect x="127" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="150" y="266" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">a2</text><rect x="186" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="209" y="266" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">a3</text><rect x="68" y="289" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="91" y="314" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">a4</text><rect x="292" y="185" width="210" height="155" rx="7" fill="white" stroke="#147c6a" /><rect x="298" y="172" width="82" height="26" rx="4" fill="#147c6a" stroke="none" /><text x="397" y="224" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">训练：组 B</text><rect x="313" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="336" y="266" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">b1</text><rect x="372" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="395" y="266" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">b2</text><rect x="431" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#147c6a" /><text x="454" y="266" font-size="18" fill="#147c6a" text-anchor="middle" font-weight="400">b3</text><rect x="537" y="185" width="210" height="155" rx="7" fill="white" stroke="#8f83ba" /><rect x="543" y="172" width="82" height="26" rx="4" fill="#8f83ba" stroke="none" /><text x="642" y="224" font-size="22" fill="#8f83ba" text-anchor="middle" font-weight="400">验证：组 C</text><rect x="558" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#8f83ba" /><text x="581" y="266" font-size="18" fill="#8f83ba" text-anchor="middle" font-weight="400">c1</text><rect x="617" y="241" width="46" height="34" rx="3" fill="#e5eeea" stroke="#8f83ba" /><text x="640" y="266" font-size="18" fill="#8f83ba" text-anchor="middle" font-weight="400">c2</text><line x1="518" y1="170" x2="518" y2="349" stroke="#bdcdbf" stroke-width="2" stroke-dasharray="6 6"/><rect x="34" y="376" width="732" height="77" rx="8" fill="#e5f1ec" stroke="none" /><text x="400" y="409" font-size="21" fill="#147c6a" text-anchor="middle" font-weight="400">先固定训练 / 验证清单，再各自在内部追加裁剪副本。</text><text x="400" y="438" font-size="20" fill="#57736b" text-anchor="middle" font-weight="400">目录隔离不自动等于患者身份隔离。</text><text x="35" y="501" font-size="23" fill="#986732" text-anchor="start" font-weight="600">旧 train100：验证原图也出现在训练集合</text><text x="46" y="541" font-size="22" fill="#147c6a" text-anchor="start" font-weight="400">训练</text><rect x="46" y="560" width="67" height="76" rx="6" fill="#eef3ee" stroke="#afc7b9" /><text x="79" y="608" font-size="27" fill="#147c6a" text-anchor="middle" font-weight="400">A</text><rect x="127" y="560" width="67" height="76" rx="6" fill="#eef3ee" stroke="#afc7b9" /><text x="160" y="608" font-size="27" fill="#147c6a" text-anchor="middle" font-weight="400">B</text><rect x="208" y="560" width="67" height="76" rx="6" fill="#eef3ee" stroke="#afc7b9" /><text x="241" y="608" font-size="27" fill="#147c6a" text-anchor="middle" font-weight="400">C</text><rect x="289" y="560" width="67" height="76" rx="6" fill="#eef3ee" stroke="#dc9b53" /><text x="322" y="608" font-size="27" fill="#147c6a" text-anchor="middle" font-weight="400">D</text><rect x="285" y="556" width="75" height="84" rx="8" fill="none" stroke="#dc9b53" stroke-width="3"/><text x="454" y="541" font-size="22" fill="#8f83ba" text-anchor="start" font-weight="400">验证</text><rect x="454" y="560" width="67" height="76" rx="6" fill="#eef3ee" stroke="#dc9b53" /><text x="487" y="608" font-size="27" fill="#8f83ba" text-anchor="middle" font-weight="400">D</text><rect x="450" y="556" width="75" height="84" rx="8" fill="none" stroke="#dc9b53" stroke-width="3"/><line x1="327" y1="650" x2="487" y2="650" stroke="#dc9b53" stroke-width="3" /><circle cx="327" cy="650" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><circle cx="487" cy="650" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="410" y="688" font-size="22" fill="#986732" text-anchor="middle" font-weight="400">两个 D 是同一原图</text><text x="35" y="738" font-size="20" fill="#57736b" text-anchor="start" font-weight="400">训练条目变多，不代表独立原图或独立受试者变多。</text><text x="34" y="767" font-size="18" fill="#7b9188" text-anchor="start" font-weight="400">计算与几何示意 · 非真实病例图像</text></g></svg>