<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1100 830" role="img" aria-labelledby="wf-title wf-desc">
<title id="wf-title">脂肪层边界学习的完整工作流</title><desc id="wf-desc">带有边界标注的灰度图像先按采集目录分组，同组全部进入训练或验证。训练时图像进入网络，人工标注通过独立支路绕过网络，仅用于和预测对照；误差反传并更新网络；验证使用相同网络且不更新参数，只用于选择最佳模型。部署时新图像进入选出的模型，输出两条边界。</desc>
<defs>
<marker id="wf-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker>
<marker id="wf-label-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#788d38"/></marker>
<marker id="wf-muted-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b8279"/></marker>
<pattern id="wf-grain" width="22" height="19" patternUnits="userSpaceOnUse"><path d="M1 5h8m5 8h5M4 17h4" stroke="#9fb3a9" stroke-width="2" opacity=".24"/><circle cx="17" cy="3" r="1" fill="#edf3e9" opacity=".35"/></pattern>
<g id="wf-image"><rect width="140" height="96" rx="8" fill="#142f32"/><rect width="140" height="96" rx="8" fill="url(#wf-grain)"/><path d="M7 31C35 19 55 43 82 32S112 29 133 35M7 69C37 56 61 73 85 64S116 64 133 70" fill="none" stroke="#d7dfd5" stroke-width="4" opacity=".25"/></g>
<g id="wf-lines"><path d="M7 31C35 19 55 43 82 32S112 29 133 35" fill="none" stroke="#72d6b4" stroke-width="3"/><path d="M7 69C37 56 61 73 85 64S116 64 133 70" fill="none" stroke="#d6e879" stroke-width="3"/></g>
<g id="wf-folder"><path d="M0 17V7Q0 0 7 0H45L57 12H124Q132 12 132 20V91Q132 98 124 98H8Q0 98 0 90Z" fill="#edf3e9" stroke="#147c6a" stroke-width="2"/><path d="M0 27H132" stroke="#147c6a" stroke-width="2"/></g>
<g id="wf-network"><rect x="0" y="8" width="26" height="76" rx="4" fill="#edf3e9" stroke="#147c6a"/><rect x="35" y="0" width="27" height="92" rx="4" fill="#c3dfcb" stroke="#147c6a"/><rect x="72" y="15" width="28" height="62" rx="4" fill="#80bca5" stroke="#147c6a"/><rect x="111" y="24" width="30" height="44" rx="4" fill="#147c6a"/><g stroke="#147c6a" stroke-width="1.5" opacity=".65"><path d="M26 25L35 14M26 68L35 80M62 14L72 27M62 80L72 65M100 27L111 33M100 65L111 57"/></g></g>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#142f32}.heading{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px}.muted{fill:#526c63}.route{fill:none;stroke:#147c6a;stroke-width:2.5;marker-end:url(#wf-arrow)}.neutral{fill:none;stroke:#6b8279;stroke-width:2;marker-end:url(#wf-muted-arrow)}</style>
</defs>
<rect width="1100" height="830" rx="20" fill="#fff"/>
<text x="32" y="42" class="heading">先划清数据边界，再让模型从误差中学习</text><text x="32" y="69" class="small muted">从数据准备到部署的完整闭环 · 图像与曲线均为教学示意</text>
<rect x="451" y="105" width="620" height="274" rx="18" fill="#edf3e9"/>
<rect x="451" y="405" width="620" height="214" rx="18" fill="#f4f6ee"/>
<rect x="451" y="668" width="620" height="131" rx="18" fill="#edf3e9"/>
<text x="474" y="135" class="label" fill="#147c6a">① 训练：用误差更新参数</text>
<text x="474" y="436" class="label">② 验证：不更新参数</text>
<text x="474" y="696" class="label">③ 部署：处理从未见过的新图</text>
<!-- 标注图像与目录组 -->
<use href="#wf-image" x="41" y="200"/><use href="#wf-lines" x="41" y="200"/>
<g fill="#fff" stroke="#147c6a" stroke-width="2"><circle cx="64" cy="227" r="4"/><circle cx="101" cy="234" r="4"/><circle cx="152" cy="231" r="4"/><circle cx="64" cy="264" r="4"/><circle cx="101" cy="268" r="4"/><circle cx="152" cy="265" r="4"/></g>
<text x="41" y="325" class="label">图像 + 人工标注</text><text x="41" y="351" class="small muted">标注指出两条边界</text>
<path d="M189 250H237" class="route"/>
<use href="#wf-folder" x="256" y="188"/>
<rect x="273" y="229" width="27" height="35" rx="3" fill="#147c6a" opacity=".8"/><rect x="307" y="229" width="27" height="35" rx="3" fill="#147c6a" opacity=".55"/><rect x="341" y="229" width="27" height="35" rx="3" fill="#d6e879"/>
<text x="254" y="325" class="label">先按采集目录分组</text><text x="254" y="351" class="small muted">同一组完整留在一侧</text><text x="254" y="377" class="small muted">避免相近帧混入验证</text>
<path d="M389 224H420V225H470" class="route"/><path d="M389 271H420V507H470" class="route"/>
<text x="258" y="438" class="small muted">现有清单：</text><text x="258" y="462" class="small">训练 50 组 · 验证 6 组</text><text x="258" y="490" class="small muted">目录隔离不自动等于</text><text x="258" y="512" class="small muted">受试者隔离</text>
<!-- 标注支路绕过网络，与实线的误差反传区分 -->
<path d="M550 173V163H973V173" fill="none" stroke="#788d38" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#wf-label-arrow)"/>
<rect x="676" y="147" width="216" height="28" rx="9" fill="#d6e879"/><text x="687" y="166" class="small" font-weight="700">人工标注支路 · 不进入网络</text>
<!-- 训练样本、网络与对照 -->
<use href="#wf-image" x="480" y="178"/><use href="#wf-lines" x="480" y="178"/>
<text x="480" y="298" class="label">训练样本</text>
<path d="M630 225H675" class="route"/>
<use href="#wf-network" x="690" y="183"/>
<text x="702" y="298" class="label">边界预测网络</text>
<path d="M840 225H889" class="route"/>
<use href="#wf-image" x="903" y="178"/><use href="#wf-lines" x="903" y="178"/>
<path d="M910 214C936 201 959 225 985 215S1015 206 1036 218M910 251C941 237 964 257 988 250S1018 242 1036 253" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4"/>
<path d="M1016 241V253M1012 241h8M1012 253h8" stroke="#d6e879" stroke-width="2"/>
<text x="904" y="298" class="label">预测与标注对照</text>
<rect x="479" y="311" width="565" height="29" rx="8" fill="#d6e879"/>
<text x="493" y="331" font-size="16" font-weight="700">图像送入网络；标注只用于比较</text>
<path d="M976 343V362H761V343" class="route"/><rect x="780" y="350" width="155" height="23" rx="8" fill="#edf3e9"/><text x="790" y="367" class="small" fill="#147c6a">误差反传 · 更新参数</text>
<g transform="translate(0 30)">
<!-- 验证路径 -->
<use href="#wf-image" x="480" y="430"/><use href="#wf-lines" x="480" y="430"/>
<text x="480" y="550" class="label">独立目录的验证样本</text>
<path d="M630 477H675" class="neutral"/>
<use href="#wf-network" x="690" y="435"/>
<rect x="803" y="428" width="28" height="24" rx="4" fill="#d6e879"/><path d="M810 428V422a7 7 0 0 1 14 0v6" fill="none" stroke="#142f32" stroke-width="2"/><circle cx="817" cy="439" r="2.5" fill="#142f32"/>
<text x="697" y="550" class="label">同一个网络，只前向</text>
<path d="M840 477H889" class="neutral"/>
<rect x="906" y="435" width="133" height="87" rx="10" fill="#fff" stroke="#147c6a" stroke-width="1.5"/>
<path d="M924 451v49h97" fill="none" stroke="#9ab3a5"/><path d="M930 462L949 472L968 482L987 486L1007 492" fill="none" stroke="#147c6a" stroke-width="3"/><circle cx="1007" cy="492" r="5" fill="#d6e879" stroke="#147c6a"/>
<text x="903" y="550" class="label">比较验证误差</text><text x="904" y="573" class="small muted">保存误差更低的模型</text>
<path d="M973 592V626H761V678" class="route"/><text x="779" y="615" class="small muted">最佳参数用于后续推理</text>
<!-- 新图部署 -->
<use href="#wf-image" x="480" y="687" transform="translate(0 0) scale(1)"/>
<rect x="477" y="761" width="150" height="29" fill="#fff"/>
<text x="495" y="784" class="small muted">新图像，无需标注</text>
<path d="M630 721H675" class="route"/>
<rect x="690" y="687" width="142" height="70" rx="12" fill="#147c6a"/><text x="712" y="717" font-size="17" font-weight="700" style="fill:#fff">选出的最佳模型</text><text x="709" y="741" class="small" style="fill:#edf3e9">参数固定 · 一次前向</text>
<path d="M840 721H889" class="route"/>
<path d="M909 703C936 692 960 717 987 705S1021 701 1043 713M909 741C936 729 959 746 987 738S1021 738 1043 748" fill="none" stroke="#147c6a" stroke-width="3"/><path d="M909 741C936 729 959 746 987 738S1021 738 1043 748" fill="none" stroke="#a1b438" stroke-width="3"/>
<text x="927" y="784" class="small muted">两条边界位置</text>
</g>
<path d="M41 620h27" stroke="#147c6a" stroke-width="3"/><text x="78" y="626" class="small muted">训练 / 推理方向</text><path d="M41 652h27" stroke="#6b8279" stroke-width="2"/><text x="78" y="658" class="small muted">验证方向</text><path d="M41 684h27" stroke="#142f32" stroke-width="2" stroke-dasharray="5 4"/><text x="78" y="690" class="small muted">对照图中的预测曲线</text>
</svg>