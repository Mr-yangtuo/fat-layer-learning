<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img"><title>三批累积一次更新：平均的是梯度贡献</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#188c77"/></marker></defs><rect width="900" height="620" fill="white"/><text x="32" y="43" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#173e38" text-anchor="start">三批累积一次更新：平均的是梯度贡献</text><text x="32" y="76" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">示意数值；真实参数有数百万个，这里只画三个参数分量。</text><text x="55" y="125" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">微批 1：16 张图</text><rect x="55" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="84" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">3</text><rect x="116" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="145" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">6</text><rect x="177" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="206" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">-3</text><text x="55" y="246" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">loss / 3 后反向</text><path d="M142 265L142 326" stroke="#188c77" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="328" y="125" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">微批 2：16 张图</text><rect x="328" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="357" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">6</text><rect x="389" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="418" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">0</text><rect x="450" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="479" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">3</text><text x="328" y="246" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">loss / 3 后反向</text><path d="M415 265L415 326" stroke="#188c77" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="601" y="125" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">微批 3：16 张图</text><rect x="601" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="630" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">0</text><rect x="662" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="691" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">3</text><rect x="723" y="151" width="58" height="60" rx="0" fill="#dcefe8" stroke="#d6e4df"/><text x="752" y="190" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" fill="#173e38" text-anchor="middle">6</text><text x="601" y="246" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">loss / 3 后反向</text><path d="M688 265L688 326" stroke="#188c77" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="55" y="352" width="790" height="89" rx="8" fill="#eff6f0" stroke="#d6e4df"/><text x="80" y="390" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="start">累积梯度 = ([3,6,−3]＋[6,0,3]＋[0,3,6]) / 3</text><text x="80" y="425" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#173e38" text-anchor="start">             = [3,3,2]</text><text x="55" y="492" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#173e38" text-anchor="start">组末：检查有限值 → 范数裁剪 → AdamW 更新 → 清梯度</text><text x="55" y="541" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">最后一组若只有 2 批，就除以 2；每个微批不是都调用 step。</text><text x="32" y="596" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#56756b" text-anchor="start">常规有效批量约48张；末批样本数不足时仍是微批均值平均，非严格逐样本等权。</text></svg>