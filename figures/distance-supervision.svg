<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 750" width="980" height="750" role="img" aria-labelledby="title desc"><title id="title">损失同时约束：边界位置正确，距离场含义也正确</title><desc id="desc">曲线位置正确不等于整个场正确；场监督让“位置减距离”的解码关系成立。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="980" height="750" fill="white"/><text x="30" y="38" font-size="25" fill="#19324c" text-anchor="start" font-weight="bold">损失同时约束：边界位置正确，距离场含义也正确</text><text x="30" y="67" font-size="16" fill="#61758c" text-anchor="start" font-weight="normal">曲线位置正确不等于整个场正确；场监督让“位置减距离”的解码关系成立。</text><rect x="30" y="105" width="448" height="265" rx="12" fill="#f8fafc" stroke="#dbe5ef"/><text x="48" y="134" font-size="20" fill="#19324c" text-anchor="start" font-weight="bold">曲线层面：位置、走势、厚度</text><line x1="108" y1="154" x2="108" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="156" y1="154" x2="156" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="204" y1="154" x2="204" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="252" y1="154" x2="252" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="300" y1="154" x2="300" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="348" y1="154" x2="348" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="396" y1="154" x2="396" y2="329" stroke="#e3eaf2" stroke-width="1" /><line x1="60" y1="198" x2="443" y2="198" stroke="#e3eaf2" stroke-width="1" /><line x1="60" y1="242" x2="443" y2="242" stroke="#e3eaf2" stroke-width="1" /><line x1="60" y1="286" x2="443" y2="286" stroke="#e3eaf2" stroke-width="1" /><path d="M60 204 Q150 167 245 203 T443 194" fill="none" stroke="#259678" stroke-width="3"/><path d="M60 214 Q150 194 245 209 T443 187" fill="none" stroke="#3478d4" stroke-width="3" stroke-dasharray="7 4"/><path d="M60 295 Q150 257 245 294 T443 285" fill="none" stroke="#259678" stroke-width="3"/><path d="M60 304 Q150 286 245 300 T443 273" fill="none" stroke="#3478d4" stroke-width="3" stroke-dasharray="7 4"/><line x1="150" y1="190" x2="150" y2="205" stroke="#e79939" stroke-width="4" /><text x="88" y="175" font-size="15" fill="#a26729" text-anchor="start" font-weight="normal">位置差</text><line x1="349" y1="199" x2="349" y2="290" stroke="#e79939" stroke-width="3" /><text x="363" y="253" font-size="15" fill="#a26729" text-anchor="start" font-weight="normal">厚度</text><text x="53" y="349" font-size="15" fill="#19324c" text-anchor="start" font-weight="normal">绿实线：标签　蓝虚线：预测；相邻列差比较走势。</text><rect x="500" y="105" width="450" height="265" rx="12" fill="#f8fafc" stroke="#dbe5ef"/><text x="518" y="134" font-size="20" fill="#19324c" text-anchor="start" font-weight="bold">场层面：大小与竖直变化率</text><line x1="550" y1="326" x2="920" y2="326" stroke="#8094a9" stroke-width="2" /><line x1="550" y1="326" x2="550" y2="162" stroke="#8094a9" stroke-width="2" /><text x="910" y="348" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">g</text><text x="527" y="161" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">d</text><line x1="560" y1="315" x2="900" y2="170" stroke="#259678" stroke-width="3" /><path d="M560 296 Q650 315 720 235 T900 193" fill="none" stroke="#3478d4" stroke-width="3" stroke-dasharray="7 4"/><text x="700" y="176" font-size="16" fill="#259678" text-anchor="start" font-weight="normal">理想 d = g−y，斜率为1</text><text x="710" y="305" font-size="15" fill="#3478d4" text-anchor="start" font-weight="normal">预测场还要学会稳定递增</text><rect x="30" y="395" width="920" height="205" rx="12" fill="#f1f8f5" stroke="#dbe5ef"/><text x="48" y="426" font-size="19" fill="#19324c" text-anchor="start" font-weight="bold">有效列内：越靠近正确边界，场误差的相对权重越大</text><rect x="60" y="529.0936537585447" width="15" height="24.90634624145525" rx="2" fill="#39a68b" stroke="none"/><rect x="82" y="528.8589723805845" width="15" height="25.141027619415482" rx="2" fill="#39a68b" stroke="none"/><rect x="104" y="528.5635246567817" width="15" height="25.436475343218206" rx="2" fill="#39a68b" stroke="none"/><rect x="126" y="528.1915762803964" width="15" height="25.808423719603674" rx="2" fill="#39a68b" stroke="none"/><rect x="148" y="527.7233188407548" width="15" height="26.276681159245207" rx="2" fill="#39a68b" stroke="none"/><rect x="170" y="527.1338149103696" width="15" height="26.86618508963045" rx="2" fill="#39a68b" stroke="none"/><rect x="192" y="526.3916699821316" width="15" height="27.608330017868404" rx="2" fill="#39a68b" stroke="none"/><rect x="214" y="525.4573605295222" width="15" height="28.542639470477802" rx="2" fill="#39a68b" stroke="none"/><rect x="236" y="524.2811291493417" width="15" height="29.71887085065825" rx="2" fill="#39a68b" stroke="none"/><rect x="258" y="522.8003346910847" width="15" height="31.199665308915357" rx="2" fill="#39a68b" stroke="none"/><rect x="280" y="520.9361162519638" width="15" height="33.06388374803619" rx="2" fill="#39a68b" stroke="none"/><rect x="302" y="518.58919337595" width="15" height="35.410806624050046" rx="2" fill="#39a68b" stroke="none"/><rect x="324" y="515.6345787930394" width="15" height="38.36542120696056" rx="2" fill="#39a68b" stroke="none"/><rect x="346" y="511.9149221214173" width="15" height="42.08507787858271" rx="2" fill="#39a68b" stroke="none"/><rect x="368" y="507.2321300460077" width="15" height="46.7678699539923" rx="2" fill="#39a68b" stroke="none"/><rect x="390" y="501.3368166992638" width="15" height="52.66318330073621" rx="2" fill="#39a68b" stroke="none"/><rect x="412" y="493.9150224157205" width="15" height="60.08497758427951" rx="2" fill="#39a68b" stroke="none"/><rect x="434" y="484.57149355687545" width="15" height="69.42850644312452" rx="2" fill="#39a68b" stroke="none"/><rect x="456" y="472.80863295999154" width="15" height="81.19136704000846" rx="2" fill="#39a68b" stroke="none"/><rect x="478" y="458.0" width="15" height="96.0" rx="2" fill="#39a68b" stroke="none"/><rect x="500" y="472.80863295999154" width="15" height="81.19136704000846" rx="2" fill="#39a68b" stroke="none"/><rect x="522" y="484.57149355687545" width="15" height="69.42850644312452" rx="2" fill="#39a68b" stroke="none"/><rect x="544" y="493.9150224157205" width="15" height="60.08497758427951" rx="2" fill="#39a68b" stroke="none"/><rect x="566" y="501.3368166992638" width="15" height="52.66318330073621" rx="2" fill="#39a68b" stroke="none"/><rect x="588" y="507.2321300460077" width="15" height="46.7678699539923" rx="2" fill="#39a68b" stroke="none"/><rect x="610" y="511.9149221214173" width="15" height="42.08507787858271" rx="2" fill="#39a68b" stroke="none"/><rect x="632" y="515.6345787930394" width="15" height="38.36542120696056" rx="2" fill="#39a68b" stroke="none"/><rect x="654" y="518.58919337595" width="15" height="35.410806624050046" rx="2" fill="#39a68b" stroke="none"/><rect x="676" y="520.9361162519638" width="15" height="33.06388374803619" rx="2" fill="#39a68b" stroke="none"/><rect x="698" y="522.8003346910847" width="15" height="31.199665308915357" rx="2" fill="#39a68b" stroke="none"/><rect x="720" y="524.2811291493417" width="15" height="29.71887085065825" rx="2" fill="#39a68b" stroke="none"/><rect x="742" y="525.4573605295222" width="15" height="28.542639470477802" rx="2" fill="#39a68b" stroke="none"/><rect x="764" y="526.3916699821316" width="15" height="27.608330017868404" rx="2" fill="#39a68b" stroke="none"/><rect x="786" y="527.1338149103696" width="15" height="26.86618508963045" rx="2" fill="#39a68b" stroke="none"/><rect x="808" y="527.7233188407548" width="15" height="26.276681159245207" rx="2" fill="#39a68b" stroke="none"/><rect x="830" y="528.1915762803964" width="15" height="25.808423719603674" rx="2" fill="#39a68b" stroke="none"/><rect x="852" y="528.5635246567817" width="15" height="25.436475343218206" rx="2" fill="#39a68b" stroke="none"/><rect x="874" y="528.8589723805845" width="15" height="25.141027619415482" rx="2" fill="#39a68b" stroke="none"/><rect x="896" y="529.0936537585447" width="15" height="24.90634624145525" rx="2" fill="#39a68b" stroke="none"/><text x="60" y="580" font-size="15" fill="#19324c" text-anchor="start" font-weight="normal">目标距离 −0.35</text><text x="476" y="580" font-size="16" fill="#19324c" text-anchor="middle" font-weight="normal">0</text><text x="870" y="580" font-size="15" fill="#19324c" text-anchor="start" font-weight="normal">+0.35</text><text x="640" y="453" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">权重 = 1 + 3e^(−|d目标|/0.08)</text><text x="48" y="632" font-size="19" fill="#19324c" text-anchor="start" font-weight="bold">总监督：坐标 + 0.2×走势 + 0.3×厚度 + 0.5×场误差 + 0.1×竖直变化率</text><text x="48" y="663" font-size="17" fill="#19324c" text-anchor="start" font-weight="normal">场误差：Smooth L1(beta=0.03) ×16；竖直相邻场差×64 与1比较。</text><text x="48" y="692" font-size="16" fill="#61758c" text-anchor="start" font-weight="normal">无效列不参与监督；相邻差分须两端都有效。近边界权重在加权平均分母中同步归一。</text><text x="30" y="730" font-size="14" fill="#61758c" text-anchor="start" font-weight="normal">教学示意；尺寸与公式来自源码，图中数值例子不代表实际预测。</text></svg>