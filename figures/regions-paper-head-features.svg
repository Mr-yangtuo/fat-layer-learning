" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="689" y="151" width="100" height="100" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="682" y="158" width="100" height="100" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="675" y="165" width="100" height="100" fill="#eef6f1" stroke="#168674" stroke-width="1" rx="0"/><path d="M691.6666666666666 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M675 181.66666666666666H775" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M708.3333333333334 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M675 198.33333333333334H775" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M725.0 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M675 215.0H775" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M741.6666666666666 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M675 231.66666666666669H775" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M758.3333333333334 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M675 248.33333333333331H775" fill="none" stroke="#c9dbd5" stroke-width="1"/><rect x="696" y="144" width="100" height="7" fill="#a7cbe4" stroke="#367eaf" stroke-width="1" rx="0"/><rect x="689" y="151" width="100" height="7" fill="#73a9cf" stroke="#367eaf" stroke-width="1" rx="0"/><text x="820" y="199" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">66 个通道</text><text x="820" y="233" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#367eaf" text-anchor="start">64 + 2</text><text x="675" y="293" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#168674" text-anchor="start">增加通道，不做数值相加</text><text x="675" y="319" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#5b706c" text-anchor="start">位置图由坐标生成，不是标签</text><path d="M32 348H928" fill="none" stroke="#c9dbd5" stroke-width="1"/><text x="40" y="391" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">再加工：让图像信息与位置信息一起参与判断</text><rect x="81" y="417" width="114" height="114" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="100.0" y="436.0" width="57.0" height="57.0" fill="#f7e9d8" stroke="#bd6b25" stroke-width="2" rx="0"/><rect x="74" y="424" width="114" height="114" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="93.0" y="443.0" width="57.0" height="57.0" fill="#f7e9d8" stroke="#bd6b25" stroke-width="2" rx="0"/><rect x="67" y="431" width="114" height="114" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="86.0" y="450.0" width="57.0" height="57.0" fill="#f7e9d8" stroke="#bd6b25" stroke-width="2" rx="0"/><rect x="60" y="438" width="114" height="114" fill="#eef6f1" stroke="#168674" stroke-width="1" rx="0"/><path d="M79.0 438V552" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M60 457.0H174" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M98.0 438V552" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M60 476.0H174" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M117.0 438V552" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M60 495.0H174" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M136.0 438V552" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M60 514.0H174" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M155.0 438V552" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M60 533.0H174" fill="none" stroke="#c9dbd5" stroke-width="1"/><rect x="79.0" y="457.0" width="57.0" height="57.0" fill="#f7e9d8" stroke="#bd6b25" stroke-width="2" rx="0"/><path d="M98.0 457.0V514.0" fill="none" stroke="#bd6b25" stroke-width="1"/><path d="M79.0 476.0H136.0" fill="none" stroke="#bd6b25" stroke-width="1"/><path d="M117.0 457.0V514.0" fill=