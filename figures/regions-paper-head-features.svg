<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-label="把位置加入特征，再用邻域信息加工"><title>把位置加入特征，再用邻域信息加工</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#168674"/></marker><linearGradient id="cy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6fafc"/><stop offset="1" stop-color="#367eaf"/></linearGradient><linearGradient id="cx"><stop offset="0" stop-color="#f6fafc"/><stop offset="1" stop-color="#367eaf"/></linearGradient></defs><rect width="960" height="660" fill="white"/><text x="32" y="44" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#173e38" text-anchor="start">把位置加入特征，再用邻域信息加工</text><text x="32" y="78" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c" text-anchor="start">每个平面都是 64×64；行列从 0 编号，叠层只示意通道数量。</text><text x="40" y="118" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">先拼入两张位置图</text><rect x="76" y="144" width="100" height="100" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="69" y="151" width="100" height="100" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="62" y="158" width="100" height="100" fill="#e2f0e9" stroke="#168674" stroke-width="1" rx="0"/><rect x="55" y="165" width="100" height="100" fill="#eef6f1" stroke="#168674" stroke-width="1" rx="0"/><path d="M71.66666666666667 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M55 181.66666666666666H155" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M88.33333333333334 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M55 198.33333333333334H155" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M105.0 165V265" fill="none" stroke="#c9dbd5" stroke-width="1"/><path d="M55 215.0H155" fill="none" stroke="#c9dbd5" stroke-width="1"/><