<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840" role="img" aria-labelledby="title"><title id="title">阈值准确率与高度集合Hausdorff的对比示意</title><rect width="800" height="840" fill="#ffffff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="36" y="45" font-size="28" fill="#173c39" text-anchor="start" font-weight="600">同一条预测线，可以怎样量误差</text><text x="36" y="79" font-size="19" fill="#5f7670" text-anchor="start" font-weight="400">上半图按同列比较；下半图展示当前 HD 的限制</text><rect x="78" y="159" width="590" height="140" rx="0" fill="#faf0e3" /><rect x="78" y="187" width="590" height="84" rx="0" fill="#eeeaf7" /><rect x="78" y="201" width="590" height="56" rx="0" fill="#e5f1ec" /><path d="M78 145L668 145" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="151" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">0</text><path d="M78 173L668 173" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="179" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">2</text><path d="M78 201L668 201" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="207" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">4</text><path d="M78 229L668 229" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="235" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">6</text><path d="M78 257L668 257" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="263" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">8</text><path d="M78 285L668 285" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="291" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">10</text><path d="M78 313L668 313" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="319" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">12</text><path d="M78 341L668 341" stroke="#cddfd6" stroke-width="1" fill="none"/><text x="66" y="347" font-size="18" fill="#5f7670" text-anchor="end" font-weight="400">14</text><path d="M120 145L120 341" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M245 145L245 341" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M370 145L370 341" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M495 145L495 341" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M620 145L620 341" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M78 140L78 351" stroke="#5f7670" stroke-width="2" fill="none"/><text x="50" y="133" font-size="20" fill="#5f7670" text-anchor="start" font-weight="400">y</text><polyline points="120,229 245,229 370,229 495,229 620,229" fill="none" stroke="#147c6a" stroke-width="3" stroke-linejoin="round"/><polyline points="120,243 245,257 370,285 495,229 620,313" fill="none" stroke="#dc9b53" stroke-width="3" stroke-linejoin="round"/><path d="M120 229L120 243" stroke="#8f83ba" stroke-width="3" fill="none"/><circle cx="120" cy="229" r="5" fill="#147c6a" stroke="#147c6a" stroke-width="2"/><circle cx="120" cy="243" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="120" y="376" font-size="19" fill="#5f7670" text-anchor="middle" font-weight="400">列 0</text><text x="133" y="242.0" font-size="19" fill="#8f83ba" text-anchor="start" font-weight="400">1</text><path d="M245 229L245 257" stroke="#8f83ba" stroke-width="3" fill="none"/><circle cx="245" cy="229" r="5" fill="#147c6a" stroke="#147c6a" stroke-width="2"/><circle cx="245" cy="257" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="245" y="376" font-size="19" fill="#5f7670" text-anchor="middle" font-weight="400">列 1</text><text x="258" y="249.0" font-size="19" fill="#8f83ba" text-anchor="start" font-weight="400">2</text><path d="M370 229L370 285" stroke="#8f83ba" stroke-width="3" fill="none"/><circle cx="370" cy="229" r="5" fill="#147c6a" stroke="#147c6a" stroke-width="2"/><circle cx="370" cy="285" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="370" y="376" font-size="19" fill="#5f7670" text-anchor="middle" font-weight="400">列 2</text><text x="383" y="263.0" font-size="19" fill="#8f83ba" text-anchor="start" font-weight="400">4</text><path d="M495 229L495 229" stroke="#8f83ba" stroke-width="3" fill="none"/><circle cx="495" cy="229" r="5" fill="#147c6a" stroke="#147c6a" stroke-width="2"/><circle cx="495" cy="229" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="495" y="376" font-size="19" fill="#5f7670" text-anchor="middle" font-weight="400">列 3</text><text x="508" y="235.0" font-size="19" fill="#8f83ba" text-anchor="start" font-weight="400">0</text><path d="M620 229L620 313" stroke="#8f83ba" stroke-width="3" fill="none"/><circle cx="620" cy="229" r="5" fill="#147c6a" stroke="#147c6a" stroke-width="2"/><circle cx="620" cy="313" r="5" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="620" y="376" font-size="19" fill="#5f7670" text-anchor="middle" font-weight="400">列 4</text><text x="633" y="277.0" font-size="19" fill="#8f83ba" text-anchor="start" font-weight="400">6</text><text x="691" y="199" font-size="20" fill="#dc9b53" text-anchor="start" font-weight="400">±5</text><text x="691" y="233" font-size="20" fill="#8f83ba" text-anchor="start" font-weight="400">±3</text><text x="691" y="268" font-size="20" fill="#147c6a" text-anchor="start" font-weight="400">±2</text><text x="78" y="408" font-size="23" fill="#173c39" text-anchor="start" font-weight="400">逐列误差：[1, 2, 4, 0, 6] 像素</text><text x="78" y="444" font-size="23" fill="#147c6a" text-anchor="start" font-weight="600">A@2 = 60%    A@3 = 60%    A@5 = 80%</text><path d="M36 470L764 470" stroke="#cddfd6" stroke-width="2" fill="none"/><text x="36" y="507" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">当前 HD 会丢掉“这些高度属于哪一列”</text><path d="M94 535L94 692" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M219 535L219 692" stroke="#cddfd6" stroke-width="1" fill="none"/><path d="M344 535L344 692" stroke="#cddfd6" stroke-width="1" fill="non