<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" width="800" height="810" role="img" aria-labelledby="title desc"><title id="title">推理后的曲线怎样变平滑</title><desc id="desc">五个原始边界高度中有一个尖峰，一维高斯平滑后曲线变缓；下方显示五个归一化权重和中心高度的计算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs><rect width="800" height="810" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="32" y="45" font-size="30" fill="#173c39" text-anchor="start" font-weight="600">推理后的曲线怎样变平滑</text><text x="32" y="78" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">使用代码默认的一维高斯核；这发生在坐标解码之后。</text><text x="35" y="125" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">平滑的是曲线高度，不是原始图像</text><path d="M75 175L75 415" stroke="#607a73" stroke-width="1.5" fill="none"/><path d="M75 415L725 415" stroke="#607a73" stroke-width="1.5" fill="none"/><text x="75" y="163" font-size="18" fill="#607a73" text-anchor="start" font-weight="400">高度 y ↓</text><text x="725" y="441" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">列 x</text><path d="M75 180L725 180" stroke="#d6e3dc" stroke-width="1" fill="none"/><text x="55" y="188" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">10</text><path d="M75 276L725 276" stroke="#d6e3dc" stroke-width="1" fill="none"/><text x="55" y="284" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">12</text><path d="M75 372L725 372" stroke="#d6e3dc" stroke-width="1" fill="none"/><text x="55" y="380" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">14</text><path d="M110.00 180.00L255.00 180.00L400.00 372.00L545.00 180.00L690.00 180.00" stroke="#dc9b53" stroke-width="4" fill="none"/><path d="M110.00 203.06L255.00 224.91L400.00 236.08L545.00 224.91L690.00 203.06" stroke="#147c6a" stroke-width="4" fill="none"/><circle cx="110" cy="180" r="6" fill="#dc9b53" stroke="none"/><circle cx="110" cy="203.055049774697" r="6" fill="#147c6a" stroke="none"/><circle cx="255" cy="180" r="6" fill="#dc9b53" stroke="none"/><circle cx="255" cy="224.9051052643873" r="6" fill="#147c6a" stroke="none"/><circle cx="400" cy="372" r="6" fill="#dc9b53" stroke="none"/><circle cx="400" cy="236.0796899218315" r="6" fill="#147c6a" stroke="none"/><circle cx="545" cy="180" r="6" fill="#dc9b53" stroke="none"/><circle cx="545" cy="224.9051052643873" r="6" fill="#147c6a" stroke="none"/><circle cx="690" cy="180" r="6" fill="#dc9b53" stroke="none"/><circle cx="690" cy="203.055049774697" r="6" fill="#147c6a" stroke="none"/><text x="35" y="480" font-size="22" fill="#dc9b53" text-anchor="start" font-weight="400">橙色原坐标：[10, 10, 14, 10, 10]</text><text x="35" y="520" font-size="21" fill="#147c6a" text-anchor="start" font-weight="400">绿色平滑后：约 [10.48, 10.94, 11.17, 10.94, 10.48]</text><rect x="65" y="565" width="125" height="70" rx="5" fill="#e5f1ec" stroke="#d6e3dc"/><text x="127.5" y="609" font-size="23" fill="#173c39" text-anchor="middle" font-weight="400">0.1201</text><rect x="205" y="565" width="125" height="70" rx="5" fill="#e5f1ec" stroke="#d6e3dc"/><text x="267.5" y="609" font-size="23" fill="#173c39" text-anchor="middle" font-weight="400">0.2339</text><rect x="345" y="565" width="125" height="70" rx="5" fill="#e5f1ec" stroke="#d6e3dc"/><text x="407.5" y="609" font-size="23" fill="#173c39" text-anchor="middle" font-weight="400">0.2921</text><rect x="485" y="565" width="125" height="70" rx="5" fill="#e5f1ec" stroke="#d6e3dc"/><text x="547.5" y="609" font-size="23" fill="#173c39" text-anchor="middle" font-weight="400">0.2339</text><rect x="625" y="565" width="125" height="70" rx="5" fill="#e5f1ec" stroke="#d6e3dc"/><text x="687.5" y="609" font-size="23" fill="#173c39" text-anchor="middle" font-weight="400">0.1201</text><text x="35" y="680" font-size="22" fill="#173c39" text-anchor="start" font-weight="400">中心新高度 = 10 × (1 − 0.2921) + 14 × 0.2921</text><text x="35" y="720" font-size="23" fill="#173c39" text-anchor="start" font-weight="400">≈ 11.168，而不是直接保留 14。</text><text x="35" y="775" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">窗口宽度 5，σ = 1.5；两端用端点复制补齐。</text></g></svg>