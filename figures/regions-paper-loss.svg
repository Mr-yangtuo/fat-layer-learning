<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img"><title>同样的面积可以隐藏错误的区域排列</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#168674"/></marker></defs><rect x="0" y="0" width="960" height="570" rx="0" fill="white" stroke="none"/><text x="32" y="44" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" fill="#173e38" font-weight="700" text-anchor="start">坐标相同，不代表区域形状正确</text><text x="32" y="79" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" fill="#5b706c" font-weight="400" text-anchor="start">沿用同一个8格数例：两列面积相同，但逐格概率不同。</text><text x="80" y="123" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" fill="#173e38" font-weight="600" text-anchor="start">人工目标 Q</text><rect x="95" y="147" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="147" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="172" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0</text><rect x="95" y="185" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="185" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="210" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0</text><rect x="95" y="223" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="223" width="42.0" height="38" rx="0" fill="#168674" stroke="none"/><rect x="95" y="223" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="248" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0.5</text><rect x="95" y="261" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="261" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="95" y="261" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="286" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="95" y="299" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="299" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="95" y="299" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="324" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="95" y="337" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="337" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="95" y="337" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="362" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="95" y="375" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="375" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="95" y="375" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="400" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="95" y="413" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="95" y="413" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="95" y="413" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="194" y="438" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><text x="338" y="123" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" fill="#173e38" font-weight="600" text-anchor="start">错误预测 R</text><rect x="354" y="147" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="147" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="172" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0</text><rect x="354" y="185" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="185" width="67.2" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="185" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="210" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0.8</text><rect x="354" y="223" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="223" width="58.8" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="223" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="248" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0.7</text><rect x="354" y="261" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="261" width="16.8" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="261" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="286" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0.2</text><rect x="354" y="299" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="299" width="67.2" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="299" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="324" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">0.8</text><rect x="354" y="337" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="337" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="337" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="362" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="354" y="375" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="375" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="375" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="400" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="354" y="413" width="84" height="38" rx="0" fill="#f4f7f5" stroke="#d6e5dd"/><rect x="354" y="413" width="84" height="38" rx="0" fill="#168674" stroke="none"/><rect x="354" y="413" width="84" height="38" rx="0" fill="none" stroke="#d1e2d8"/><text x="453" y="438" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">1</text><rect x="570" y="147" width="350" height="138" rx="8" fill="#edf5f0" stroke="#d6e5dd"/><text x="590" y="182" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">两列的区域总量都为 5.5</text><text x="590" y="217" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">上方占比都为 (8−5.5)／8</text><text x="590" y="254" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" fill="#168674" font-weight="600" text-anchor="start">解码都得 79.6875 像素</text><rect x="570" y="318" width="350" height="126" rx="8" fill="#fff4e7" stroke="#d6e5dd"/><text x="590" y="352" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#173e38" font-weight="400" text-anchor="start">但这里往下走：0.7 → 0.2</text><text x="590" y="388" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" fill="#c97624" font-weight="400" text-anchor="start">局部单调惩罚：0.7−0.2＝0.5</text><text x="590" y="421" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" fill="#173e38" font-weight="400" text-anchor="start">区域 BCE 还会逐格比较 Q 与 R</text><path d="M351 261H486" stroke="#c97624" stroke-width="3" fill="none"/><text x="80" y="493" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" fill="#173e38" font-weight="600" text-anchor="start">面积汇总可以抵消错误；逐格监督才能看见这些错位。</text><text x="80" y="533" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" fill="#5b706c" font-weight="400" text-anchor="start">坐标项管位置，区域BCE管每格概率，单调项管向下变化的方向。</text></svg>