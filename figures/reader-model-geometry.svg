<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 855" width="800" height="855" role="img" aria-labelledby="title desc"><title id="title">三个几何约束，看的是不同问题</title><desc id="desc">上部两条边界交叉，中部匀速斜线与折角对比，下部斜线与水平线对比，分别展示拓扑、二阶平滑和TV的惩罚对象。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs><rect width="800" height="855" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="32" y="45" font-size="30" fill="#173c39" text-anchor="start" font-weight="600">三个几何约束，看的是不同问题</text><text x="32" y="78" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">图像纵坐标向下增大；曲线示意不代表实际预测。</text><text x="35" y="125" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">上下顺序：不要交叉</text><path d="M65 155L65 300" stroke="#607a73" stroke-width="1.5" fill="none"/><path d="M65 300L505 300" stroke="#607a73" stroke-width="1.5" fill="none"/><text x="65" y="143" font-size="18" fill="#607a73" text-anchor="start" font-weight="400">高度 y ↓</text><text x="505" y="326" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">列 x</text><path d="M65.00 195.00L120.00 198.00L175.00 201.00L230.00 204.00L285.00 207.00L340.00 210.00L395.00 213.00L450.00 216.00L505.00 219.00" stroke="#147c6a" stroke-width="4" fill="none"/><path d="M65.00 275.00L120.00 263.00L175.00 251.00L230.00 239.00L285.00 227.00L340.00 215.00L395.00 203.00L450.00 191.00L505.00 179.00" stroke="#dc9b53" stroke-width="4" fill="none"/><text x="545" y="188" font-size="20" fill="#147c6a" text-anchor="start" font-weight="400">绿：上边界</text><text x="545" y="225" font-size="20" fill="#dc9b53" text-anchor="start" font-weight="400">橙：下边界</text><text x="545" y="267" font-size="21" fill="#dc9b53" text-anchor="start" font-weight="400">交叉部分受罚</text><path d="M35 342L765 342" stroke="#d6e3dc" stroke-width="2" fill="none"/><text x="35" y="383" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">二阶平滑：惩罚突然拐弯</text><path d="M80.00 455.00L235.00 485.00L390.00 515.00" stroke="#147c6a" stroke-width="4" fill="none"/><path d="M450.00 455.00L605.00 525.00L750.00 490.00" stroke="#dc9b53" stroke-width="4" fill="none"/><circle cx="80" cy="455" r="6" fill="#173c39" stroke="none"/><text x="80" y="440" font-size="21" fill="#173c39" text-anchor="middle" font-weight="400">2</text><circle cx="235" cy="485" r="6" fill="#173c39" stroke="none"/><text x="235" y="470" font-size="21" fill="#173c39" text-anchor="middle" font-weight="400">3</text><circle cx="390" cy="515" r="6" fill="#173c39" stroke="none"/><text x="390" y="500" font-size="21" fill="#173c39" text-anchor="middle" font-weight="400">4</text><circle cx="450" cy="455" r="6" fill="#173c39" stroke="none"/><text x="450" y="440" font-size="21" fill="#173c39" text-anchor="middle" font-weight="400">2</text><circle cx="605" cy="525" r="6" fill="#173c39" stroke="none"/><text x="605" y="510" font-size="21" fill="#173c39" text-anchor="middle" font-weight="400">4</text><circle cx="750" cy="490" r="6" fill="#173c39" stroke="none"/><text x="750" y="475" font-size="21" fill="#173c39" text-anchor="middle" font-weight="400">3</text><text x="235" y="565" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">|2 − 2×3 + 4| = 0</text><text x="605" y="565" font-size="22" fill="#dc9b53" text-anchor="middle" font-weight="400">|2 − 2×4 + 3| = 3</text><path d="M35 602L765 602" stroke="#d6e3dc" stroke-width="2" fill="none"/><text x="35" y="643" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">TV：惩罚相邻列的高度差</text><path d="M80.00 710.00L235.00 740.00L390.00 770.00" stroke="#147c6a" stroke-width="4" fill="none"/><path d="M450.00 740.00L605.00 740.00L750.00 740.00" stroke="#8f83ba" stroke-width="4" fill="none"/><text x="235" y="822" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">[2,3,4]：TV = 1</text><text x="605" y="822" font-size="22" fill="#8f83ba" text-anchor="middle" font-weight="400">[3,3,3]：TV = 0</text></g></svg>