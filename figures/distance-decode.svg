<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 645" width="980" height="645" role="img" aria-labelledby="title desc"><title id="title">距离场如何变成一个边界坐标</title><desc id="desc">先将每一行变成一个边界候选，再按离零的远近加权。理想场的所有候选一致。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="980" height="645" fill="white"/><text x="30" y="38" font-size="25" fill="#19324c" text-anchor="start" font-weight="bold">距离场如何变成一个边界坐标</text><text x="30" y="67" font-size="16" fill="#61758c" text-anchor="start" font-weight="normal">先将每一行变成一个边界候选，再按离零的远近加权。理想场的所有候选一致。</text><text x="35" y="112" font-size="21" fill="#19324c" text-anchor="start" font-weight="bold">理想的一列：正确归一化边界高度为 0.40</text><text x="60" y="153" font-size="17" fill="#61758c" text-anchor="start" font-weight="bold">行位置 g</text><text x="250" y="153" font-size="17" fill="#61758c" text-anchor="start" font-weight="bold">预测距离 d</text><text x="447" y="153" font-size="17" fill="#61758c" text-anchor="start" font-weight="bold">候选边界 g−d</text><text x="700" y="153" font-size="17" fill="#61758c" text-anchor="start" font-weight="bold">近零权重</text><rect x="35" y="169" width="910" height="49" rx="12" fill="#f6f8fb" stroke="#dbe5ef"/><text x="85" y="197" font-size="22" fill="#19324c" text-anchor="start" font-weight="normal">0.10</text><text x="280" y="197" font-size="22" fill="#3478d4" text-anchor="start" font-weight="normal">-0.30</text><text x="480" y="197" font-size="22" fill="#259678" text-anchor="start" font-weight="bold">0.40</text><rect x="710" y="177" width="170" height="24" rx="3" fill="#e2e8ef" stroke="none"/><rect x="710" y="177" width="1" height="24" rx="3" fill="#22a9b9" stroke="none"/><text x="913" y="197" font-size="15" fill="#19324c" text-anchor="middle" font-weight="normal">0.001</text><rect x="35" y="232" width="910" height="49" rx="12" fill="#f1f8f5" stroke="#dbe5ef"/><text x="85" y="260" font-size="22" fill="#19324c" text-anchor="start" font-weight="normal">0.30</text><text x="280" y="260" font-size="22" fill="#3478d4" text-anchor="start" font-weight="normal">-0.10</text><text x="480" y="260" font-size="22" fill="#259678" text-anchor="start" font-weight="bold">0.40</text><rect x="710" y="240" width="170" height="24" rx="3" fill="#e2e8ef" stroke="none"/><rect x="710" y="240" width="164.79014903940623" height="24" rx="3" fill="#22a9b9" stroke="none"/><text x="913" y="260" font-size="15" fill="#19324c" text-anchor="middle" font-weight="normal">0.499</text><rect x="35" y="295" width="910" height="49" rx="12" fill="#f1f8f5" stroke="#dbe5ef"/><text x="85" y="323" font-size="22" fill="#19324c" text-anchor="start" font-weight="normal">0.50</text><text x="280" y="323" font-size="22" fill="#b46f38" text-anchor="start" font-weight="normal">+0.10</text><text x="480" y="323" font-size="22" fill="#259678" text-anchor="start" font-weight="bold">0.40</text><rect x="710" y="303" width="170" height="24" rx="3" fill="#e2e8ef" stroke="none"/><rect x="710" y="303" width="164.79014903940623" height="24" rx="3" fill="#22a9b9" stroke="none"/><text x="913" y="323" font-size="15" fill="#19324c" text-anchor="middle" font-weight="normal">0.499</text><rect x="35" y="358" width="910" height="49" rx="12" fill="#f6f8fb" stroke="#dbe5ef"/><text x="85" y="386" font-size="22" fill="#19324c" text-anchor="start" font-weight="normal">0.70</text><text x="280" y="386" font-size="22" fill="#b46f38" text-anchor="start" font-weight="normal">+0.30</text><text x="480" y="386" font-size="22" fill="#259678" text-anchor="start" font-weight="bold">0.40</text><rect x="710" y="366" width="170" height="24" rx="3" fill="#e2e8ef" stroke="none"/><rect x="710" y="366" width="1" height="24" rx="3" fill="#22a9b9" stroke="none"/><text x="913" y="386" font-size="15" fill="#19324c" text-anchor="middle" font-weight="normal">0.001</text><rect x="35" y="421" width="910" height="49" rx="12" fill="#f6f8fb" stroke="#dbe5ef"/><text x="85" y="449" font-size="22" fill="#19324c" text-anchor="start" font-weight="normal">0.90</text><text x="280" y="449" font-size="22" fill="#b46f38" text-anchor="start" font-weight="normal">+0.50</text><text x="480" y="449" font-size="22" fill="#259678" text-anchor="start" font-weight="bold">0.40</text><rect x="710" y="429" width="170" height="24" rx="3" fill="#e2e8ef" stroke="none"/><rect x="710" y="429" width="1" height="24" rx="3" fill="#22a9b9" stroke="none"/><text x="913" y="449" font-size="15" fill="#19324c" text-anchor="middle" font-weight="normal">&lt;0.001</text><rect x="35" y="500" width="430" height="98" rx="12" fill="#f3f7fb" stroke="#dbe5ef"/><text x="49" y="527" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">权重 = softmax(−|d| / 0.03)</text><text x="49" y="551" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">零附近的行更受信任；权重总和为1。</text><text x="49" y="575" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">它是解码权重，不是热图监督目标。</text><rect x="485" y="500" width="460" height="98" rx="12" fill="#edf8f3" stroke="#dbe5ef"/><text x="499" y="527" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">加权平均所有 g−d → y = 0.40</text><text x="499" y="551" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">随后按头排序，64列插值成256列。</text><text x="499" y="575" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">统一返回：0.40 × 255 = 102像素。</text><text x="30" y="625" font-size="14" fill="#61758c" text-anchor="start" font-weight="normal">教学示意；尺寸与公式来自源码，图中数值例子不代表实际预测。</text></svg>