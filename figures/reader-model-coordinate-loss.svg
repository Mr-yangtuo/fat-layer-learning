<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 825" width="800" height="825" role="img" aria-labelledby="title desc"><title id="title">坐标误差怎样被有效掩码筛选</title><desc id="desc">绿色参考曲线与橙色预测曲线逐列对照，灰色无效列被排除，三列误差进入MSE和MAE的明确数值计算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs><rect width="800" height="825" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="32" y="45" font-size="30" fill="#173c39" text-anchor="start" font-weight="600">坐标误差怎样被有效掩码筛选</text><text x="32" y="78" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">图中灰色的一列不参与坐标 MSE 与 MAE。</text><text x="35" y="125" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">同一条边界，逐列比较高度</text><path d="M75 170L75 455" stroke="#607a73" stroke-width="1.5" fill="none"/><path d="M75 455L725 455" stroke="#607a73" stroke-width="1.5" fill="none"/><text x="75" y="158" font-size="18" fill="#607a73" text-anchor="start" font-weight="400">高度 y ↓</text><text x="725" y="481" font-size="18" fill="#607a73" text-anchor="end" font-weight="400">列 x</text><rect x="435" y="172" width="90" height="282" rx="0" fill="#f0f0ee" stroke="none"/><path d="M140 246L140 246" stroke="#dc9b53" stroke-width="3" fill="none" stroke-dasharray="5 4"/><path d="M310 274L310 302" stroke="#dc9b53" stroke-width="3" fill="none" stroke-dasharray="5 4"/><path d="M480 302L480 414" stroke="#a8aaa5" stroke-width="3" fill="none" stroke-dasharray="5 4"/><path d="M650 330L650 274" stroke="#dc9b53" stroke-width="3" fill="none" stroke-dasharray="5 4"/><path d="M140.00 246.00L310.00 274.00L480.00 302.00L650.00 330.00" stroke="#147c6a" stroke-width="4" fill="none"/><path d="M140.00 246.00L310.00 302.00L480.00 414.00L650.00 274.00" stroke="#dc9b53" stroke-width="4" fill="none"/><circle cx="140" cy="246" r="6" fill="#147c6a" stroke="none"/><circle cx="140" cy="246" r="6" fill="#dc9b53" stroke="none"/><text x="140" y="492" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">有效</text><circle cx="310" cy="274" r="6" fill="#147c6a" stroke="none"/><circle cx="310" cy="302" r="6" fill="#dc9b53" stroke="none"/><text x="310" y="492" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">有效</text><circle cx="480" cy="302" r="6" fill="#147c6a" stroke="none"/><circle cx="480" cy="414" r="6" fill="#dc9b53" stroke="none"/><text x="480" y="492" font-size="22" fill="#607a73" text-anchor="middle" font-weight="400">无效</text><circle cx="650" cy="330" r="6" fill="#147c6a" stroke="none"/><circle cx="650" cy="274" r="6" fill="#dc9b53" stroke="none"/><text x="650" y="492" font-size="22" fill="#147c6a" text-anchor="middle" font-weight="400">有效</text><text x="35" y="540" font-size="22" fill="#147c6a" text-anchor="start" font-weight="400">参考高度：2，3，4，5</text><text x="420" y="540" font-size="22" fill="#dc9b53" text-anchor="start" font-weight="400">预测高度：2，4，8，3</text><text x="35" y="590" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">误差：0，+1，忽略，−2</text><rect x="35" y="625" width="350" height="120" rx="8" fill="#eef4ef" stroke="#d6e3dc"/><rect x="415" y="625" width="350" height="120" rx="8" fill="#f5f1e8" stroke="#d6e3dc"/><text x="60" y="666" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">坐标 MSE</text><text x="60" y="710" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">(0² + 1² + (−2)²) / 3 = 5/3</text><text x="440" y="666" font-size="24" fill="#dc9b53" text-anchor="start" font-weight="400">评估 MAE</text><text x="440" y="710" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">(0 + 1 + 2) / 3 = 1 像素</text><text x="35" y="790" font-size="21" fill="#607a73" text-anchor="start" font-weight="400">无效列先排除；分母是剩余有效坐标的数量。</text></g></svg>