<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 855" width="800" height="855" role="img" aria-labelledby="title desc"><title id="title">同一份评分，两种不同的使用方式</title><desc id="desc">同一个三行原始评分，左侧逐元素Sigmoid条形结果总和不为1，右侧Softmax条形结果总和为1并得到坐标1.575。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs><rect width="800" height="855" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="32" y="45" font-size="30" fill="#173c39" text-anchor="start" font-weight="600">同一份评分，两种不同的使用方式</text><text x="32" y="78" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">这个 3 行例子只比较变换，不代表上一幅高斯目标的尺寸。</text><text x="35" y="125" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">同一列的原始分数 z = [0, 1, 2]</text><rect x="110" y="160" width="150" height="70" rx="8" fill="#f4f5f2" stroke="#d6e3dc"/><text x="185" y="207" font-size="32" fill="#173c39" text-anchor="middle" font-weight="400">0</text><rect x="310" y="160" width="150" height="70" rx="8" fill="#f4f5f2" stroke="#d6e3dc"/><text x="385" y="207" font-size="32" fill="#173c39" text-anchor="middle" font-weight="400">1</text><rect x="510" y="160" width="150" height="70" rx="8" fill="#f4f5f2" stroke="#d6e3dc"/><text x="585" y="207" font-size="32" fill="#173c39" text-anchor="middle" font-weight="400">2</text><text x="185" y="260" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">第 0 行</text><text x="385" y="260" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">第 1 行</text><text x="585" y="260" font-size="20" fill="#607a73" text-anchor="middle" font-weight="400">第 2 行</text><path d="M400 300L400 697" stroke="#d6e3dc" stroke-width="2" fill="none"/><text x="35" y="330" font-size="24" fill="#147c6a" text-anchor="start" font-weight="600">Sigmoid：各行分别变换</text><text x="430" y="330" font-size="24" fill="#8f83ba" text-anchor="start" font-weight="600">Softmax：整列一起归一化</text><text x="35" y="414" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">0</text><rect x="75" y="390" width="127.5" height="32" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="335" y="415" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.500</text><text x="430" y="414" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">0</text><rect x="470" y="390" width="22.057490426743215" height="32" rx="2" fill="#8f83ba" stroke="#8f83ba"/><text x="745" y="415" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.090</text><text x="35" y="499" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">1</text><rect x="75" y="475" width="186.41993755065124" height="32" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="335" y="500" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.731</text><text x="430" y="499" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">1</text><rect x="470" y="475" width="59.95847540842542" height="32" rx="2" fill="#8f83ba" stroke="#8f83ba"/><text x="745" y="500" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.245</text><text x="35" y="584" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">2</text><rect x="75" y="560" width="224.60325488435998" height="32" rx="2" fill="#147c6a" stroke="#147c6a"/><text x="335" y="585" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.881</text><text x="430" y="584" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">2</text><rect x="470" y="560" width="162.98403416483137" height="32" rx="2" fill="#8f83ba" stroke="#8f83ba"/><text x="745" y="585" font-size="20" fill="#173c39" text-anchor="middle" font-weight="400">0.665</text><text x="35" y="685" font-size="20" fill="#147c6a" text-anchor="start" font-weight="400">总和 ≈ 2.112，不要求为 1</text><text x="430" y="685" font-size="22" fill="#8f83ba" text-anchor="start" font-weight="400">总和 = 1</text><text x="35" y="745" font-size="22" fill="#173c39" text-anchor="start" font-weight="400">与高斯软目标逐位置算 BCE</text><text x="430" y="745" font-size="22" fill="#173c39" text-anchor="start" font-weight="400">按行号加权平均</text><text x="430" y="787" font-size="18" fill="#607a73" text-anchor="start" font-weight="400">ŷ = 0×.090 + 1×.245 + 2×.665</text><text x="430" y="825" font-size="25" fill="#8f83ba" text-anchor="start" font-weight="600">≈ 1.575 行</text></g></svg>