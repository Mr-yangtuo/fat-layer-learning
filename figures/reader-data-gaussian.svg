<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 855" width="800" height="855" role="img"><title>两种高斯热图：形状相似，数值不同</title><rect width="800" height="855" fill="white"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="34" y="43" font-size="28" fill="#173c39" text-anchor="start" font-weight="600">两种高斯热图：形状相似，数值不同</text><text x="34" y="78" font-size="20" fill="#57736b" text-anchor="start" font-weight="400">只比较归一化：两边暂取 H=5、y=2、σ=1。</text><line x1="34" y1="101" x2="766" y2="101" stroke="#dce7df" stroke-width="1" /><text x="45" y="145" font-size="23" fill="#173c39" text-anchor="start" font-weight="600">Dataset 生成的热图</text><text x="45" y="177" font-size="19" fill="#57736b" text-anchor="start" font-weight="400">行号</text><text x="171" y="177" font-size="19" fill="#57736b" text-anchor="start" font-weight="400">单列热图</text><text x="64" y="229" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">0</text><rect x="121" y="196" width="75" height="49" rx="3" fill="#dfedeb" stroke="#cadbd0" /><text x="221" y="229" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.1353</text><text x="64" y="282" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">1</text><rect x="121" y="249" width="75" height="49" rx="3" fill="#70b0a5" stroke="#cadbd0" /><text x="221" y="282" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.6065</text><text x="64" y="335" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">2</text><rect x="121" y="302" width="75" height="49" rx="3" fill="#147c6a" stroke="#cadbd0" /><text x="221" y="335" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">1.0000</text><text x="64" y="388" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">3</text><rect x="121" y="355" width="75" height="49" rx="3" fill="#70b0a5" stroke="#cadbd0" /><text x="221" y="388" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.6065</text><text x="64" y="441" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">4</text><rect x="121" y="408" width="75" height="49" rx="3" fill="#dfedeb" stroke="#cadbd0" /><text x="221" y="441" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.1353</text><rect x="45" y="480" width="325" height="60" rx="7" fill="#e5f1ec" stroke="none" /><text x="207" y="519" font-size="23" fill="#147c6a" text-anchor="middle" font-weight="400">列和 ≈ 2.4837</text><text x="425" y="145" font-size="23" fill="#173c39" text-anchor="start" font-weight="600">损失内重新生成的目标</text><text x="425" y="177" font-size="19" fill="#57736b" text-anchor="start" font-weight="400">行号</text><text x="551" y="177" font-size="19" fill="#57736b" text-anchor="start" font-weight="400">单列热图</text><text x="444" y="229" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">0</text><rect x="501" y="196" width="75" height="49" rx="3" fill="#f2f8f7" stroke="#cadbd0" /><text x="601" y="229" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.0545</text><text x="444" y="282" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">1</text><rect x="501" y="249" width="75" height="49" rx="3" fill="#c6dfdb" stroke="#cadbd0" /><text x="601" y="282" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.2442</text><text x="444" y="335" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">2</text><rect x="501" y="302" width="75" height="49" rx="3" fill="#a0cac3" stroke="#cadbd0" /><text x="601" y="335" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.4026</text><text x="444" y="388" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">3</text><rect x="501" y="355" width="75" height="49" rx="3" fill="#c6dfdb" stroke="#cadbd0" /><text x="601" y="388" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.2442</text><text x="444" y="441" font-size="22" fill="#57736b" text-anchor="middle" font-weight="400">4</text><rect x="501" y="408" width="75" height="49" rx="3" fill="#f2f8f7" stroke="#cadbd0" /><text x="601" y="441" font-size="24" fill="#147c6a" text-anchor="start" font-weight="400">0.0545</text><rect x="425" y="480" width="325" height="60" rx="7" fill="#e5f1ec" stroke="none" /><text x="587" y="519" font-size="23" fill="#147c6a" text-anchor="middle" font-weight="400">列和 ≈ 1.0000</text><text x="58" y="584" font-size="22" fill="#173c39" text-anchor="start" font-weight="400">g(r) = exp[−(r−y)² / 2σ²]</text><text x="438" y="584" font-size="22" fill="#173c39" text-anchor="start" font-weight="400">q(r) = g(r) / Σg(r)</text><rect x="34" y="621" width="732" height="163" rx="8" fill="#f3f7f4" stroke="none" /><text x="55" y="657" font-size="25" fill="#147c6a" text-anchor="start" font-weight="600">当前默认训练使用右侧目标</text><text x="55" y="691" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">左侧热图虽进入 batch，但没有作为 loss_fn 的输入。</text><text x="55" y="723" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">损失函数拿坐标重新构造，并沿高度归一化。</text><text x="55" y="758" font-size="20" fill="#57736b" text-anchor="start" font-weight="400">实际 σ：Dataset 来自配置；默认损失内部固定为 3。</text><text x="34" y="832" font-size="18" fill="#7b9188" text-anchor="start" font-weight="400">计算与几何示意 · 非真实病例图像</text></g></svg>