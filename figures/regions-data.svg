<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img"><title>标签与视图：横向插值，纵向同步缩放</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#188c77"/></marker></defs><rect width="900" height="660" fill="white"/><text x="32" y="43" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#173e38" text-anchor="start">标签与视图：横向插值，纵向同步缩放</text><text x="32" y="76" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">示意数据，不使用测试集图像；原图与裁剪副本都从固定索引读取。</text><text x="38" y="124" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">稀疏点 → 每列浮点高度</text><rect x="45" y="145" width="380" height="240" rx="0" fill="#f8fbf9" stroke="#d6e4df"/><path d="M45 145L45 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M83 145L83 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M121 145L121 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M159 145L159 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M197 145L197 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M235 145L235 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M273 145L273 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M311 145L311 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M349 145L349 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M387 145L387 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M425 145L425 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 145L425 145" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 185L425 185" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 225L425 225" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 265L425 265" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 305L425 305" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 345L425 345" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M45 385L425 385" stroke="#d6e4df" stroke-width="1" fill="none"/><path d="M121 225L235 305L349 265" stroke="#188c77" stroke-width="3" fill="none"/><circle cx="121" cy="225" r="7" fill="#c87929"/><circle cx="235" cy="305" r="7" fill="#c87929"/><circle cx="349" cy="265" r="7" fill="#c87929"/><circle cx="159" cy="251.66666666666666" r="4" fill="#188c77"/><circle cx="197" cy="278.3333333333333" r="4" fill="#188c77"/><circle cx="273" cy="291.6666666666667" r="4" fill="#188c77"/><circle cx="311" cy="278.3333333333333" r="4" fill="#188c77"/><rect x="45" y="405" width="38" height="30" rx="0" fill="#edf0ee" stroke="#d6e4df"/><rect x="83" y="405" width="38" height="30" rx="0" fill="#edf0ee" stroke="#d6e4df"/><rect x="121" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="159" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="197" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="235" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="273" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="311" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="349" y="405" width="38" height="30" rx="0" fill="#dcefe8" stroke="#d6e4df"/><rect x="387" y="405" width="38" height="30" rx="0" fill="#edf0ee" stroke="#d6e4df"/><text x="45" y="470" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#188c77" text-anchor="start">首末点内插值：有效</text><text x="45" y="506" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#56756b" text-anchor="start">范围外填端点：仍无效</text><text x="500" y="124" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">裁底副本：图像和坐标一起变</text><rect x="510" y="145" width="130" height="260" rx="0" fill="#edf4f0" stroke="#d6e4df"/><rect x="510" y="353" width="130" height="52" rx="0" fill="#e5ddd1" stroke="#d6e4df"/><path d="M510 353L640 353" stroke="#c87929" stroke-width="3" fill="none" stroke-dasharray="5 4"/><path d="M510 249Q575 224 640 249" stroke="#188c77" stroke-width="3" fill="none"/><text x="513" y="433" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#173e38" text-anchor="start">原高 100</text><path d="M655 255L706 255" stroke="#188c77" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="725" y="145" width="130" height="260" rx="0" fill="#edf4f0" stroke="#d6e4df"/><path d="M725 275Q790 245 855 275" stroke="#188c77" stroke-width="3" fill="none"/><text x="724" y="433" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#173e38" text-anchor="start">裁后拉回 100</text><text x="500" y="474" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">裁掉底部 20 行：保留 80 行</text><text x="500" y="511" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">原 y=40 → 40×100/80=50</text><rect x="45" y="552" width="810" height="57" rx="8" fill="#fff0d9" stroke="#d6e4df"/><text x="65" y="588" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38" text-anchor="start">坐标可夹到范围内，但 valid 必须另外排除被裁掉或越界的监督。</text><text x="32" y="636" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#56756b" text-anchor="start">实际模型网格为256×256；图中100/80只用于说明裁剪与纵坐标缩放。</text></svg>