<svg xmlns="http://www.w3.org/2000/svg" width="900" height="655" viewBox="0 0 900 655" role="img"><title>三个间隔，确定两个有序高度</title><rect width="900" height="655" fill="white"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="30" y="42" fill="#173e39" font-size="28" font-weight="700" text-anchor="start">三个间隔，确定两个有序高度</text><text x="30" y="75" fill="#58746d" font-size="18" font-weight="400" text-anchor="start">每一个查询同时给出上边界与下边界的控制高度</text><rect x="85" y="150" width="145" height="68.0" rx="0" fill="#b7d9c9" stroke="white"/><text x="260" y="190.0" fill="#173e39" font-size="23" font-weight="400" text-anchor="start">顶端到上边界 0.20</text><rect x="85" y="218.0" width="145" height="118.99999999999999" rx="0" fill="#f4cb94" stroke="white"/><text x="260" y="283.5" fill="#173e39" font-size="23" font-weight="400" text-anchor="start">两条边界之间 0.35</text><rect x="85" y="337.0" width="145" height="153.0" rx="0" fill="#c9c0e9" stroke="white"/><text x="260" y="419.5" fill="#173e39" font-size="23" font-weight="400" text-anchor="start">下边界到底端 0.45</text><path d="M66 150L66 490" fill="none" stroke="#58746d" stroke-width="2"/><text x="58" y="155" fill="#58746d" font-size="18" font-weight="400" text-anchor="end">0</text><text x="58" y="495" fill="#58746d" font-size="18" font-weight="400" text-anchor="end">1</text><path d="M78 218L780 218" fill="none" stroke="#147d71" stroke-width="2" stroke-dasharray="5 4"/><circle cx="230" cy="218" r="6" fill="#147d71" stroke="white" stroke-width="2"/><text x="475" y="204" fill="#147d71" font-size="21" font-weight="400" text-anchor="start">上控制高度 = 0.20</text><path d="M78 337L780 337" fill="none" stroke="#c88039" stroke-width="2" stroke-dasharray="5 4"/><circle cx="230" cy="337" r="6" fill="#c88039" stroke="white" stroke-width="2"/><text x="475" y="323" fill="#c88039" font-size="21" font-weight="400" text-anchor="start">下控制高度 = 0.20 + 0.35 = 0.55</text><text x="525" y="467" fill="#173e39" font-size="23" font-weight="600" text-anchor="middle">三个间隔非负，总和为1</text><text x="525" y="505" fill="#173e39" font-size="20" font-weight="400" text-anchor="middle">所以 0 ≤ 上控制高度 ≤ 下控制高度 ≤ 1</text><rect x="45" y="528" width="810" height="66" rx="5" fill="#f5f8f5" stroke="#ccdcd6"/><text x="65" y="555" fill="#173e39" font-size="22" font-weight="400" text-anchor="start">12个查询各做一次：得到 control[B,2,12]</text><text x="65" y="581" fill="#58746d" font-size="18" font-weight="400" text-anchor="start">与非负、每列和为1的样条基函数相乘后，整条曲线仍保持上下有序。</text><text x="30" y="635" fill="#58746d" font-size="16" font-weight="400" text-anchor="start">教学示意 · 数值用于说明机制，不代表训练或测试结果</text></g></svg>