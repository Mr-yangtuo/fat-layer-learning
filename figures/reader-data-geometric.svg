<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 805" width="800" height="805" role="img"><title>裁上、裁下、压缩：纵坐标的变化不同</title><rect width="800" height="805" fill="white"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="34" y="43" font-size="28" fill="#173c39" text-anchor="start" font-weight="600">裁上、裁下、压缩：纵坐标的变化不同</text><text x="34" y="78" font-size="20" fill="#57736b" text-anchor="start" font-weight="400">统一数例：H=100，处理 20 行；追踪原来的 y=40。</text><line x1="34" y1="101" x2="766" y2="101" stroke="#dce7df" stroke-width="1" /><text x="60" y="145" font-size="23" fill="#173c39" text-anchor="start" font-weight="600">原图</text><rect x="60" y="165" width="184" height="174" rx="4" fill="#edf3ee" stroke="#cfdfd4" /><rect x="60" y="165.0" width="184" height="17.400000000000002" rx="0" fill="#d9e7df" stroke="none" /><rect x="60" y="182.4" width="184" height="17.400000000000002" rx="0" fill="#c4d9cb" stroke="none" /><rect x="60" y="199.8" width="184" height="17.400000000000002" rx="0" fill="#d9e7df" stroke="none" /><rect x="60" y="217.2" width="184" height="17.400000000000002" rx="0" fill="#c4d9cb" stroke="none" /><rect x="60" y="234.60000000000002" width="184" height="17.400000000000002" rx="0" fill="#d9e7df" stroke="none" /><rect x="60" y="252.0" width="184" height="17.400000000000002" rx="0" fill="#c4d9cb" stroke="none" /><rect x="60" y="269.4" width="184" height="17.400000000000002" rx="0" fill="#d9e7df" stroke="none" /><rect x="60" y="286.8" width="184" height="17.400000000000002" rx="0" fill="#c4d9cb" stroke="none" /><rect x="60" y="304.20000000000005" width="184" height="17.400000000000002" rx="0" fill="#d9e7df" stroke="none" /><rect x="60" y="321.6" width="184" height="17.400000000000002" rx="0" fill="#c4d9cb" stroke="none" /><line x1="60" y1="234.60000000000002" x2="244" y2="234.60000000000002" stroke="#147c6a" stroke-width="4" /><circle cx="179.60000000000002" cy="234.60000000000002" r="6" fill="#dc9b53" stroke="#dc9b53" stroke-width="2"/><text x="257" y="2