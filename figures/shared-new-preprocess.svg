<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650">
<title>新方法的灰度输入怎样进入三通道骨干</title><desc>一张灰度图缩放并除255，复制为三个逻辑通道，再使用不同的固定均值和标准差归一化；一个灰度0.5的像素变为约0.066、0.196和0.418。</desc>
<defs><pattern id="p" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#dbe5e1"/><path d="M0 18V0H18" stroke="#b2c5bd" fill="none"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#187b6b"/></marker></defs>
<rect width="960" height="650" fill="white"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#173e36">
<text x="36" y="48" font-size="28" font-weight="bold">同一张灰度图，怎样进入三通道骨干</text>
<text x="36" y="82" font-size="18" fill="#59796c">区域法、距离场法与样条法共用的输入约定；B 表示一批图像数量</text>
<rect x="50" y="137" width="180" height="180" fill="url(#p)" stroke="#87ac9c"/>
<path d="M50 190Q95 165 140 199T230 185M50 267Q100 242 150 275T230 261" fill="none" stroke="#6b8e82" stroke-width="7"/>
<text x="51" y="350" font-size="21">灰度输入 [B,1,256,256]</text>
<text x="51" y="383" font-size="18">data.py：像素值 ÷ 255</text>
<path d="M255 225H340" stroke="#187b6b" stroke-width="2" marker-end="url(#a)"/>
<g fill="url(#p)" stroke="#187b6b"><rect x="405" y="117" width="180" height="180"/><rect x="386" y="137" width="180" height="180"/><rect x="367" y="157" width="180" height="180"/></g>
<text x="345" y="373" font-size="21">expand：三个通道</text>
<text x="345" y="405" font-size="18">三个通道的原始亮度相同</text>
<path d="M605 225H675" stroke="#187b6b" stroke-width="2" marker-end="url(#a)"/>
<text x="694" y="155" font-size="21">每个通道分别归一化</text>
<text x="694" y="199" font-size="20">(像素值 − μ) / σ</text>
<text x="694" y="243" font-size="18">μ = [.485, .456, .406]</text>
<text x="694" y="280" font-size="18">σ = [.229, .224, .225]</text>
<text x="694" y="330" font-size="21" fill="#187b6b">送入骨干 [B,3,256,256]</text>
<rect x="36" y="450" width="888" height="143" rx="8" fill="#f1f7f3" stroke="#d3e3d9"/>
<text x="58" y="486" font-size="22" font-weight="bold">一个像素的数值例子</text>
<text x="58" y="525" font-size="21">灰度值 0.5　→　三份 0.5　→　约 [0.066, 0.196, 0.418]</text>
<text x="58" y="561" font-size="18">固定常量在模型内部使用；这里没有逐图均值标准化，也没有旧模型的去噪卷积。</text>
<text x="36" y="626" font-size="16" fill="#6b8176">教学示意；图形为合成纹理，非数据集图像。expand 是广播视图，不产生三次独立观测。</text>
</g></svg>
