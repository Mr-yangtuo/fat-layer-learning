<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="846" viewBox="0 0 1100 846" role="img" aria-labelledby="block-title block-desc">
<title id="block-title">轻量骨干的倒残差积木</title><desc id="block-desc">展示较少通道先经1乘1卷积展开，逐通道空间卷积，可选的全局通道门控，再经1乘1线性投影压缩。仅在步长1且输入输出通道一致时保留残差相加。下方以小网格对照普通卷积和逐通道卷积。</desc>
<defs><marker id="block-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1100" height="846" rx="18" fill="#fffefa" stroke="none" /><text x="45" y="48" font-size="29" fill="#142f32" text-anchor="start" font-weight="700">轻量骨干里的一个“倒残差”积木</text><text x="45" y="80" font-size="16" fill="#58726b" text-anchor="start" font-weight="400">通道先展开，逐通道提取空间信息，再压缩回来；图中用少量平面代表许多通道。</text><rect x="30" y="112" width="1040" height="330" rx="15" fill="#edf3e9" stroke="none" /><circle cx="46" cy="145" r="15" fill="#147c6a"/><text x="46" y="150" font-size="15" fill="white" text-anchor="middle" font-weight="700">1</text><text x="127" y="151" font-size="17" fill="#142f32" text-anchor="middle" font-weight="700">输入特征</text><circle cx="255" cy="145" r="15" fill="#147c6a"/><text x="255" y="150" font-size="15" fill="white" text-anchor="middle" font-weight="700">2</text><text x="336" y="151" font-size="17" fill="#142f32" text-anchor="middle" font-weight="700">通道展开</text><circle cx="466" cy="145" r="15" fill="#147c6a"/><text x="466" y="150" font-size="15" fill="white" text-anchor="middle" font-weight="700">3</text><text x="547" y="151" font-size="17" fill="#142f32" text-anchor="middle" font-weight="700">逐通道卷积</text><circle cx="676" cy="145" r="15" fill="#147c6a"/><text x="676" y="150" font-size="15" fill="white" text-anchor="middle" font-weight="700">4</text><text x="757" y="151" font-size="17" fill="#142f32" text-anchor="middle" font-weight="700">可选的通道调节</text><circle cx="884" cy="145" r="15" fill="#147c6a"/><text x="884" y="150" font-size="15" fill="white" text-anchor="middle" font-weight="700">5</text><text x="965" y="151" font-size="17" fill="#142f32" text-anchor="middle" font-weight="700">线性投影</text><rect x="81.0" y="214.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="76.0" y="219.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="71.0" y="224.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="71.0" y="224.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#a9c4b2" /><line x1="85.4" y1="224.0" x2="85.4" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="71.0" y1="238.4" x2="143.0" y2="238.4" stroke="#a9c4b2" stroke-width="0.7" /><line x1="99.8" y1="224.0" x2="99.8" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="71.0" y1="252.8" x2="143.0" y2="252.8" stroke="#a9c4b2" stroke-width="0.7" /><line x1="114.2" y1="224.0" x2="114.2" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="71.0" y1="267.2" x2="143.0" y2="267.2" stroke="#a9c4b2" stroke-width="0.7" /><line x1="128.6" y1="224.0" x2="128.6" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="71.0" y1="281.6" x2="143.0" y2="281.6" stroke="#a9c4b2" stroke-width="0.7" /><path d="M75.0 251.36 Q101.2 239.84 112 254.96 T139.0 249.2" stroke="#147c6a" stroke-width="1.6" fill="none" /><rect x="299.0" y="205.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="295.0" y="209.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="291.0" y="213.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="287.0" y="217.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="283.0" y="221.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="279.0" y="225.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="275.0" y="229.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="271.0" y="233.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="271.0" y="233.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#a9c4b2" /><line x1="285.4" y1="233.0" x2="285.4" y2="305.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="271.0" y1="247.4" x2="343.0" y2="247.4" stroke="#a9c4b2" stroke-width="0.7" /><line x1="299.8" y1="233.0" x2="299.8" y2="305.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="271.0" y1="261.8" x2="343.0" y2="261.8" stroke="#a9c4b2" stroke-width="0.7" /><line x1="314.2" y1="233.0" x2="314.2" y2="305.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="271.0" y1="276.2" x2="343.0" y2="276.2" stroke="#a9c4b2" stroke-width="0.7" /><line x1="328.6" y1="233.0" x2="328.6" y2="305.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="271.0" y1="290.6" x2="343.0" y2="290.6" stroke="#a9c4b2" stroke-width="0.7" /><path d="M275.0 260.36 Q310.2 248.84 321 263.96 T339.0 258.2" stroke="#147c6a" stroke-width="1.6" fill="none" /><rect x="480" y="221" width="54" height="68" rx="2" fill="#d5e6d8" stroke="#83aa92" /><rect x="494" y="245" width="23" height="23" rx="1" fill="#d6e879" stroke="#147c6a" /><rect x="504" y="217" width="54" height="68" rx="2" fill="#d5e6d8" stroke="#83aa92" /><rect x="518" y="241" width="23" height="23" rx="1" fill="#d6e879" stroke="#147c6a" /><rect x="528" y="213" width="54" height="68" rx="2" fill="#d5e6d8" stroke="#83aa92" /><rect x="542" y="237" width="23" height="23" rx="1" fill="#d6e879" stroke="#147c6a" /><rect x="552" y="209" width="54" height="68" rx="2" fill="#d5e6d8" stroke="#83aa92" /><rect x="566" y="233" width="23" height="23" rx="1" fill="#d6e879" stroke="#147c6a" /><rect x="718.0" y="207.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="714.0" y="211.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="710.0" y="215.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="706.0" y="219.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="702.0" y="223.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="698.0" y="227.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="694.0" y="231.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="694.0" y="231.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#a9c4b2" /><line x1="708.4" y1="231.0" x2="708.4" y2="303.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="694.0" y1="245.4" x2="766.0" y2="245.4" stroke="#a9c4b2" stroke-width="0.7" /><line x1="722.8" y1="231.0" x2="722.8" y2="303.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="694.0" y1="259.8" x2="766.0" y2="259.8" stroke="#a9c4b2" stroke-width="0.7" /><line x1="737.2" y1="231.0" x2="737.2" y2="303.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="694.0" y1="274.2" x2="766.0" y2="274.2" stroke="#a9c4b2" stroke-width="0.7" /><line x1="751.6" y1="231.0" x2="751.6" y2="303.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="694.0" y1="288.6" x2="766.0" y2="288.6" stroke="#a9c4b2" stroke-width="0.7" /><path d="M698.0 258.36 Q731.2 246.84 742 261.96 T762.0 256.2" stroke="#147c6a" stroke-width="1.6" fill="none" /><rect x="702" y="310" width="17" height="27" rx="2" fill="#147c6a" stroke="none" /><text x="702" y="357" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">1</text><rect x="726" y="310" width="17" height="16.0" rx="2" fill="#147c6a" stroke="none" /><text x="731" y="357" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">0.5</text><rect x="750" y="310" width="17" height="23.0" rx="2" fill="#147c6a" stroke="none" /><text x="760" y="357" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">0.8</text><rect x="774" y="310" width="17" height="11.0" rx="2" fill="#147c6a" stroke="none" /><text x="789" y="357" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">0.2</text><rect x="919.0" y="214.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="914.0" y="219.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="909.0" y="224.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#6a9b85" /><rect x="909.0" y="224.0" width="72" height="72" rx="2" fill="#edf3e9" stroke="#a9c4b2" /><line x1="923.4" y1="224.0" x2="923.4" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="909.0" y1="238.4" x2="981.0" y2="238.4" stroke="#a9c4b2" stroke-width="0.7" /><line x1="937.8" y1="224.0" x2="937.8" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="909.0" y1="252.8" x2="981.0" y2="252.8" stroke="#a9c4b2" stroke-width="0.7" /><line x1="952.2" y1="224.0" x2="952.2" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="909.0" y1="267.2" x2="981.0" y2="267.2" stroke="#a9c4b2" stroke-width="0.7" /><line x1="966.6" y1="224.0" x2="966.6" y2="296.0" stroke="#a9c4b2" stroke-width="0.7" /><line x1="909.0" y1="281.6" x2="981.0" y2="281.6" stroke="#a9c4b2" stroke-width="0.7" /><path d="M913.0 251.36 Q939.2 239.84 950 254.96 T977.0 249.2" stroke="#147c6a" stroke-width="1.6" fill="none" /><path d="M157 255H257" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)"/><path d="M375 255H471" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)"/><path d="M592 255H682" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)"/><path d="M801 255H902" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)"/><text x="112" y="377" font-size="16" fill="#142f32" text-anchor="middle" font-weight="700">较少通道</text><text x="112" y="402" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">保留输入，准备跳接</text><text x="321" y="377" font-size="16" fill="#142f32" text-anchor="middle" font-weight="700">1×1 卷积</text><text x="321" y="402" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">把信息映射到更多通道</text><text x="532" y="377" font-size="16" fill="#142f32" text-anchor="middle" font-weight="700">3×3 或 5×5 卷积</text><text x="532" y="402" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">每张平面使用自己的小卷积核</text><text x="742" y="377" font-size="16" fill="#142f32" text-anchor="middle" font-weight="700">先看全图，再分配权重</text><text x="742" y="402" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">每个通道乘一个 0～1 的系数</text><text x="950" y="377" font-size="16" fill="#142f32" text-anchor="middle" font-weight="700">1×1 卷积</text><text x="950" y="402" font-size="14" fill="#58726b" text-anchor="middle" font-weight="400">压回目标通道，末尾不再激活</text><path d="M60 255H18V475H1082V332H1000V309" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)" stroke-dasharray="6 5"/><circle cx="1000" cy="286" r="19" fill="#fffefa" stroke="#147c6a" stroke-width="2"/><text x="1000" y="293" font-size="25" fill="#147c6a" text-anchor="middle" font-weight="700">+</text><path d="M982 275H990" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)"/><path d="M1021 286H1052" stroke="#147c6a" stroke-width="2.5" fill="none" marker-end="url(#block-arrow)"/><rect x="311" y="458" width="480" height="35" rx="6" fill="#fffefa" stroke="none" /><text x="551" y="482" font-size="15" fill="#147c6a" text-anchor="middle" font-weight="700">可选残差：输入与输出的空间尺寸、通道数都相同才相加</text><text x="45" y="541" font-size="22" fill="#142f32" text-anchor="start" font-weight="700">为什么比普通卷积省计算？</text><rect x="45" y="564" width="482" height="169" rx="10" fill="#f2f5e8" stroke="none" /><rect x="548" y="564" width="507" height="169" rx="10" fill="#f2f5e8" stroke="none" /><rect x="66" y="600" width="44" height="44" rx="2" fill="#d1e5d5" stroke="#a9c4b2" /><line x1="80.66666666666667" y1="600" x2="80.66666666666667" y2="644" stroke="#a9c4b2" stroke-width="0.7" /><line x1="66" y1="614.6666666666666" x2="110" y2="614.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><line x1="95.33333333333333" y1="600" x2="95.33333333333333" y2="644" stroke="#a9c4b2" stroke-width="0.7" /><line x1="66" y1="629.3333333333334" x2="110" y2="629.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><rect x="83" y="592" width="44" height="44" rx="2" fill="#d1e5d5" stroke="#a9c4b2" /><line x1="97.66666666666667" y1="592" x2="97.66666666666667" y2="636" stroke="#a9c4b2" stroke-width="0.7" /><line x1="83" y1="606.6666666666666" x2="127" y2="606.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><line x1="112.33333333333333" y1="592" x2="112.33333333333333" y2="636" stroke="#a9c4b2" stroke-width="0.7" /><line x1="83" y1="621.3333333333334" x2="127" y2="621.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><rect x="100" y="584" width="44" height="44" rx="2" fill="#d1e5d5" stroke="#a9c4b2" /><line x1="114.66666666666667" y1="584" x2="114.66666666666667" y2="628" stroke="#a9c4b2" stroke-width="0.7" /><line x1="100" y1="598.6666666666666" x2="144" y2="598.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><line x1="129.33333333333334" y1="584" x2="129.33333333333334" y2="628" stroke="#a9c4b2" stroke-width="0.7" /><line x1="100" y1="613.3333333333334" x2="144" y2="613.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><line x1="145" y1="613" x2="195" y2="603" stroke="#147c6a" stroke-width="1" /><line x1="145" y1="619" x2="195" y2="620" stroke="#147c6a" stroke-width="1" /><line x1="145" y1="625" x2="195" y2="637" stroke="#147c6a" stroke-width="1" /><rect x="201" y="596" width="64" height="64" rx="2" fill="#d6e879" stroke="#a9c4b2" /><line x1="222.33333333333334" y1="596" x2="222.33333333333334" y2="660" stroke="#a9c4b2" stroke-width="0.7" /><line x1="201" y1="617.3333333333334" x2="265" y2="617.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><line x1="243.66666666666666" y1="596" x2="243.66666666666666" y2="660" stroke="#a9c4b2" stroke-width="0.7" /><line x1="201" y1="638.6666666666666" x2="265" y2="638.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><text x="292" y="592" font-size="17" fill="#142f32" text-anchor="start" font-weight="700">普通空间卷积</text><text x="292" y="622" font-size="15" fill="#142f32" text-anchor="start" font-weight="400">空间邻域和输入通道</text><text x="292" y="646" font-size="15" fill="#142f32" text-anchor="start" font-weight="400">一起进行加权求和。</text><text x="66" y="702" font-size="15" fill="#58726b" text-anchor="start" font-weight="400">参数量：核面积 × 输入通道 × 输出通道</text><rect x="568" y="609" width="38" height="38" rx="2" fill="#d1e5d5" stroke="#a9c4b2" /><line x1="580.6666666666666" y1="609" x2="580.6666666666666" y2="647" stroke="#a9c4b2" stroke-width="0.7" /><line x1="568" y1="621.6666666666666" x2="606" y2="621.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><line x1="593.3333333333334" y1="609" x2="593.3333333333334" y2="647" stroke="#a9c4b2" stroke-width="0.7" /><line x1="568" y1="634.3333333333334" x2="606" y2="634.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><line x1="657" y1="590" x2="690" y2="590" stroke="#147c6a" stroke-width="1.6" /><rect x="696" y="581" width="14" height="14" rx="0" fill="#d6e879" stroke="#147c6a" /><rect x="592" y="598" width="38" height="38" rx="2" fill="#d1e5d5" stroke="#a9c4b2" /><line x1="604.6666666666666" y1="598" x2="604.6666666666666" y2="636" stroke="#a9c4b2" stroke-width="0.7" /><line x1="592" y1="610.6666666666666" x2="630" y2="610.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><line x1="617.3333333333334" y1="598" x2="617.3333333333334" y2="636" stroke="#a9c4b2" stroke-width="0.7" /><line x1="592" y1="623.3333333333334" x2="630" y2="623.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><line x1="657" y1="612" x2="690" y2="612" stroke="#147c6a" stroke-width="1.6" /><rect x="696" y="603" width="14" height="14" rx="0" fill="#d6e879" stroke="#147c6a" /><rect x="616" y="587" width="38" height="38" rx="2" fill="#d1e5d5" stroke="#a9c4b2" /><line x1="628.6666666666666" y1="587" x2="628.6666666666666" y2="625" stroke="#a9c4b2" stroke-width="0.7" /><line x1="616" y1="599.6666666666666" x2="654" y2="599.6666666666666" stroke="#a9c4b2" stroke-width="0.7" /><line x1="641.3333333333334" y1="587" x2="641.3333333333334" y2="625" stroke="#a9c4b2" stroke-width="0.7" /><line x1="616" y1="612.3333333333334" x2="654" y2="612.3333333333334" stroke="#a9c4b2" stroke-width="0.7" /><line x1="657" y1="634" x2="690" y2="634" stroke="#147c6a" stroke-width="1.6" /><rect x="696" y="625" width="14" height="14" rx="0" fill="#d6e879" stroke="#147c6a" /><text x="741" y="592" font-size="17" fill="#142f32" text-anchor="start" font-weight="700">把两件事分开做</text><text x="741" y="622" font-size="15" fill="#142f32" text-anchor="start" font-weight="400">逐通道卷积负责空间；</text><text x="741" y="646" font-size="15" fill="#142f32" text-anchor="start" font-weight="400">1×1 卷积负责通道混合。</text><text x="568" y="702" font-size="15" fill="#58726b" text-anchor="start" font-weight="400">逐通道空间卷积参数量：核面积 × 通道数</text><text x="45" y="774" font-size="14" fill="#58726b" text-anchor="start" font-weight="400">这是骨干内部的通用结构示意，不是主网络的完整结构。不同积木可能省略通道展开或通道调节。</text><text x="45" y="798" font-size="14" fill="#58726b" text-anchor="start" font-weight="400">步长为 2 时，逐通道卷积会缩小空间尺寸；这种情况不使用这里画出的直接残差相加。</text><text x="45" y="822" font-size="14" fill="#58726b" text-anchor="start" font-weight="400">展开和空间卷积后通常接归一化与激活；投影后接归一化，但不再接非线性激活。</text></g></svg>