oe UI,sans-serif" font-size="21" font-weight="600" fill="#173e38" text-anchor="start">门控 g = exp(−误差/8)</text><text x="92" y="446" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">0</text><rect x="267" y="423" width="330" height="31" rx="0" fill="#f1f4f2" stroke="#d6e4df"/><rect x="267" y="423" width="330" height="31" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="620" y="447" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">1.000</text><text x="92" y="494" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">8</text><rect x="267" y="471" width="330" height="31" rx="0" fill="#f1f4f2" stroke="#d6e4df"/><rect x="267" y="471" width="121.40021558657597" height="31" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="620" y="495" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">0.368</text><text x="92" y="542" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">16</text><rect x="267" y="519" width="330" height="31" rx="0" fill="#f1f4f2" stroke="#d6e4df"/><rect x="267" y="519" width="44.66064346808219" height="31" rx="0" fill="#188c77" stroke="#d6e4df"/><text x="620" y="543" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38" text-anchor="start">0.135</text><text x="50" y="602" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">学生 loss = 监督 + 0.55 × min(epoch/10,1) ×（坐标蒸馏 + 区域 KL）</text><text x="32" y="626" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#56756b" text-anchor="start">门控仅由训练标注计算；教师错得越多，影响越弱，但不自动归零。</text></svg>