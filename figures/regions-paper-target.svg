<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-label="区域标签：人工边界穿过半格，这格就取 0.5"><title>区域标签：人工边界穿过半格，这格就取 0.5</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#168674"/></marker><linearGradient id="coord-y" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f9fc"/><stop offset="1" stop-color="#367eaf"/></linearGradient><linearGradient id="coord-x"><stop offset="0" stop-color="#f4f9fc"/><stop offset="1" stop-color="#367eaf"/></linearGradient></defs><rect width="960" height="800" fill="white"/><text x="32" y="45" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#173e38">区域标签：人工边界穿过半格，这格就取 0.5</text><text x="32" y="80" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c">标签由人工曲线自动计算；本图只展示一列，不是模型预测。</text><text x="32" y="125" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38">① 真值 y = 79.6875 → u = 79.6875 / 255 = 0.3125</text><text x="37" y="171" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="600" fill="#173e38">② 边界位于 2.5 格</text><text x="344" y="171" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38">i</text><text x="409" y="171" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38">Q(i)</text><rect x="188" y="195" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><text x="344" y="230.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">0</text><text x="409" y="230.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">0</text><rect x="188" y="252" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><text x="344" y="287.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">1</text><text x="409" y="287.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">0</text><rect x="188" y="309" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><rect x="188" y="337.5" width="112" height="28.5" rx="0" fill="#deeee7" stroke="#c9dbd5"/><rect x="188" y="337.5" width="112" height="28.5" rx="0" fill="#168674" stroke="#c9dbd5"/><text x="344" y="344.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">2</text><text x="409" y="344.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#bd6b25">0.5</text><rect x="188" y="366" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><rect x="188" y="366" width="112" height="57" rx="0" fill="#deeee7" stroke="#c9dbd5"/><rect x="188" y="366" width="112" height="57" rx="0" fill="#168674" stroke="#c9dbd5"/><text x="344" y="401.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">3</text><text x="409" y="401.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">1</text><rect x="188" y="423" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><rect x="188" y="423" width="112" height="57" rx="0" fill="#deeee7" stroke="#c9dbd5"/><rect x="188" y="423" width="112" height="57" rx="0" fill="#168674" stroke="#c9dbd5"/><text x="344" y="458.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">4</text><text x="409" y="458.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">1</text><rect x="188" y="480" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><rect x="188" y="480" width="112" height="57" rx="0" fill="#deeee7" stroke="#c9dbd5"/><rect x="188" y="480" width="112" height="57" rx="0" fill="#168674" stroke="#c9dbd5"/><text x="344" y="515.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">5</text><text x="409" y="515.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">1</text><rect x="188" y="537" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><rect x="188" y="537" width="112" height="57" rx="0" fill="#deeee7" stroke="#c9dbd5"/><rect x="188" y="537" width="112" height="57" rx="0" fill="#168674" stroke="#c9dbd5"/><text x="344" y="572.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">6</text><text x="409" y="572.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">1</text><rect x="188" y="594" width="112" height="57" rx="0" fill="#f6f9f7" stroke="#c9dbd5"/><rect x="188" y="594" width="112" height="57" rx="0" fill="#deeee7" stroke="#c9dbd5"/><rect x="188" y="594" width="112" height="57" rx="0" fill="#168674" stroke="#c9dbd5"/><text x="344" y="629.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#5b706c">7</text><text x="409" y="629.5" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">1</text><path d="M49 337.5H310" stroke="#bd6b25" stroke-width="3" fill="none" stroke-dasharray="7 4"/><text x="48" y="321.5" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#bd6b25">人工边界</text><text x="48" y="368.5" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#bd6b25">2.5 格</text><text x="186" y="681" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#5b706c">0 起始编号；第 2 格下半填色</text><text x="492" y="187" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="600" fill="#173e38">③ 按格子的覆盖比例算标签</text><rect x="482" y="209" width="443" height="105" rx="8" fill="#e6f0f8" stroke="#c9dbd5"/><text x="499" y="248" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#367eaf">Q(i) = clip((i＋1) − h·u, 0, 1)</text><text x="499" y="288" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38">h·u = 8 × 0.3125 = 2.5</text><text x="500" y="363" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">i=1：2 − 2.5 = −0.5 → 0</text><rect x="482" y="393" width="443" height="46" rx="5" fill="#fff0dd" stroke="#c9dbd5"/><text x="500" y="425" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#bd6b25">i=2：3 − 2.5 = 0.5 → 0.5</text><text x="500" y="487" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173e38">i=3：4 − 2.5 = 1.5 → 1</text><text x="492" y="549" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38">第 2 格：下半位于边界下方。</text><text x="492" y="585" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="400" fill="#173e38">上半取 0，下半取 1，平均为 0.5。</text><text x="492" y="635" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#5b706c">clip：小于 0 取 0，大于 1 取 1。</text><path d="M32 703H928" stroke="#c9dbd5" stroke-width="1" fill="none"/><text x="480" y="741" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#173e38">Q = [0, 0, 0.5, 1, 1, 1, 1, 1]</text><text x="32" y="776" text-anchor="start" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#5b706c">8 格仅为演示；实际区域图高度为 64。人工曲线先给出坐标，再自动生成区域标签。</text></svg>