<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img"><title>监督不是只看一个坐标：区域形状也要正确</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#188c77"/></marker></defs><rect width="900" height="660" fill="white"/><text x="32" y="43" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="27" font-weight="700" fill="#173e38" text-anchor="start">监督不是只看一个坐标：区域形状也要正确</text><text x="32" y="76" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" fill="#56756b" text-anchor="start">同列面积相同，仍可能有不同的概率排列；区域 BCE 与单调项补充约束。</text><text x="45" y="124" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">真实阶跃 Q</text><text x="310" y="124" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">错误的上下反复</text><text x="627" y="124" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#173e38" text-anchor="start">BCE 逐格比较</text><rect x="60" y="145" width="110" height="40" rx="0" fill="rgb(245,250,247)" stroke="#d6e4df"/><text x="190" y="173" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0</text><rect x="330" y="145" width="110" height="40" rx="0" fill="rgb(245,250,247)" stroke="#d6e4df"/><text x="460" y="173" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0</text><text x="625" y="173" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=0   p=0</text><rect x="60" y="185" width="110" height="40" rx="0" fill="rgb(245,250,247)" stroke="#d6e4df"/><text x="190" y="213" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0</text><rect x="330" y="185" width="110" height="40" rx="0" fill="rgb(161,206,197)" stroke="#d6e4df"/><text x="460" y="213" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0.4</text><text x="625" y="213" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=0   p=0.4</text><rect x="60" y="225" width="110" height="40" rx="0" fill="rgb(245,250,247)" stroke="#d6e4df"/><text x="190" y="253" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0</text><rect x="330" y="225" width="110" height="40" rx="0" fill="rgb(98,173,159)" stroke="#d6e4df"/><text x="460" y="253" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0.7</text><text x="625" y="253" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=0   p=0.7</text><rect x="60" y="265" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="190" y="293" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="330" y="265" width="110" height="40" rx="0" fill="rgb(203,228,222)" stroke="#d6e4df"/><text x="460" y="293" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0.2</text><text x="625" y="293" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=1   p=0.2</text><rect x="60" y="305" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="190" y="333" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="330" y="305" width="110" height="40" rx="0" fill="rgb(77,162,147)" stroke="#d6e4df"/><text x="460" y="333" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0.8</text><text x="625" y="333" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=1   p=0.8</text><rect x="60" y="345" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="190" y="373" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="330" y="345" width="110" height="40" rx="0" fill="rgb(56,151,134)" stroke="#d6e4df"/><text x="460" y="373" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">0.9</text><text x="625" y="373" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=1   p=0.9</text><rect x="60" y="385" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="190" y="413" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="330" y="385" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="460" y="413" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><text x="625" y="413" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=1   p=1</text><rect x="60" y="425" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="190" y="453" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><rect x="330" y="425" width="110" height="40" rx="0" fill="rgb(35,140,122)" stroke="#d6e4df"/><text x="460" y="453" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">1</text><text x="625" y="453" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">q=1   p=1</text><path d="M310 255L475 255" stroke="#c87929" stroke-width="3" fill="none"/><text x="294" y="504" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#c87929" text-anchor="start">0.7 → 0.2：往下反而减少</text><text x="294" y="538" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#c87929" text-anchor="start">单调惩罚 = 0.5（再乘系数）</text><text x="46" y="580" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#173e38" text-anchor="start">坐标：位置对不对；斜率：走势像不像真值；厚度：两条线间距对不对。</text><text x="32" y="636" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#56756b" text-anchor="start">图中预测仅演示错误形状，不是实际模型结果；单调为软惩罚，不能保证严格成立。</text></svg>