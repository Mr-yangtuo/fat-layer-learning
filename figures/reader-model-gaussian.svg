<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 755" width="800" height="755" role="img" aria-labelledby="title desc"><title id="title">把一个高度，展开成一整列软目标</title><desc id="desc">一列五行像素、逐行高斯权重长条和归一化后的数值对照，展示从边界高度2生成高斯软目标。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147c6a"/></marker></defs><rect width="800" height="755" fill="#fff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="32" y="45" font-size="30" fill="#173c39" text-anchor="start" font-weight="600">把一个高度，展开成一整列软目标</text><text x="32" y="78" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">数例只有 5 行；绿色长条长度表示归一化前的高斯权重。</text><text x="35" y="123" font-size="24" fill="#173c39" text-anchor="start" font-weight="600">已知这一列的边界高度：2</text><text x="45" y="190" font-size="20" fill="#173c39" text-anchor="start" font-weight="400">第 0 行</text><rect x="155" y="158" width="80" height="46" rx="2" fill="#edf3ed" stroke="#d6e3dc"/><text x="195" y="189" font-size="20" fill="#fff" text-anchor="middle" font-weight="400"> </text><rect x="290" y="158" width="35.1871736415193" height="46" rx="2" fill="#c5ded2" stroke="#147c6a"/><text x="570" y="190" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.1353</text><text x="695" y="190" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.0545</text><text x="45" y="245" font-size="20" fill="#173c39" text-anchor="start" font-weight="400">第 1 行</text><rect x="155" y="213" width="80" height="46" rx="2" fill="#edf3ed" stroke="#d6e3dc"/><text x="195" y="244" font-size="20" fill="#fff" text-anchor="middle" font-weight="400"> </text><rect x="290" y="213" width="157.6979715252847" height="46" rx="2" fill="#c5ded2" stroke="#147c6a"/><text x="570" y="245" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.6065</text><text x="695" y="245" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.2442</text><text x="45" y="300" font-size="20" fill="#173c39" text-anchor="start" font-weight="400">第 2 行</text><rect x="155" y="268" width="80" height="46" rx="2" fill="#147c6a" stroke="#d6e3dc"/><text x="195" y="299" font-size="20" fill="#fff" text-anchor="middle" font-weight="400">边界</text><rect x="290" y="268" width="260.0" height="46" rx="2" fill="#c5ded2" stroke="#147c6a"/><text x="570" y="300" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">1.0000</text><text x="695" y="300" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.4026</text><text x="45" y="355" font-size="20" fill="#173c39" text-anchor="start" font-weight="400">第 3 行</text><rect x="155" y="323" width="80" height="46" rx="2" fill="#edf3ed" stroke="#d6e3dc"/><text x="195" y="354" font-size="20" fill="#fff" text-anchor="middle" font-weight="400"> </text><rect x="290" y="323" width="157.6979715252847" height="46" rx="2" fill="#c5ded2" stroke="#147c6a"/><text x="570" y="355" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.6065</text><text x="695" y="355" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.2442</text><text x="45" y="410" font-size="20" fill="#173c39" text-anchor="start" font-weight="400">第 4 行</text><rect x="155" y="378" width="80" height="46" rx="2" fill="#edf3ed" stroke="#d6e3dc"/><text x="195" y="409" font-size="20" fill="#fff" text-anchor="middle" font-weight="400"> </text><rect x="290" y="378" width="35.1871736415193" height="46" rx="2" fill="#c5ded2" stroke="#147c6a"/><text x="570" y="410" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.1353</text><text x="695" y="410" font-size="21" fill="#173c39" text-anchor="start" font-weight="400">0.0545</text><text x="310" y="145" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">高斯权重</text><text x="570" y="145" font-size="19" fill="#607a73" text-anchor="start" font-weight="400">未归一化</text><text x="685" y="145" font-size="19" fill="#607a73" text-anchor="start" font-weight="400">最终目标</text><path d="M35 455L765 455" stroke="#d6e3dc" stroke-width="2" fill="none"/><text x="35" y="495" font-size="24" fill="#173c39" text-anchor="start" font-weight="400">离中心近，数值大；离中心远，数值小。</text><text x="35" y="540" font-size="23" fill="#173c39" text-anchor="start" font-weight="400">这一列总和 = 2.4837</text><text x="35" y="582" font-size="22" fill="#173c39" text-anchor="start" font-weight="400">每一行 ÷ 2.4837，得到总和为 1 的软目标。</text><text x="35" y="640" font-size="26" fill="#147c6a" text-anchor="start" font-weight="400">g(r) = exp(−(r − 2)² / (2 × 1²))</text><text x="35" y="686" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">此处 σ = 1 便于展示；项目实际损失固定 σ = 3。</text><text x="35" y="723" font-size="20" fill="#607a73" text-anchor="start" font-weight="400">中心可为小数：例如 2.5 会让第 2、3 行权重相同。</text></g></svg>