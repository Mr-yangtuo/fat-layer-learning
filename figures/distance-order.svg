<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" role="img" aria-labelledby="title desc"><title id="title">同步排序：换头时，坐标与整列距离场一起移动</title><desc id="desc">白色横线表示各头的零位置。竖条表示一整列场，不是某个单独像素。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="980" height="610" fill="white"/><text x="30" y="38" font-size="25" fill="#19324c" text-anchor="start" font-weight="bold">同步排序：换头时，坐标与整列距离场一起移动</text><text x="30" y="67" font-size="16" fill="#61758c" text-anchor="start" font-weight="normal">白色横线表示各头的零位置。竖条表示一整列场，不是某个单独像素。</text><text x="35" y="112" font-size="21" fill="#19324c" text-anchor="start" font-weight="bold">解码后，一列的两个头尚未固定上下身份</text><text x="130" y="155" font-size="20" fill="#c981ae" text-anchor="middle" font-weight="bold">原头0</text><rect x="80" y="178" width="100" height="220" rx="5" fill="#c981ae" stroke="none"/><line x1="80" y1="209.4" x2="180" y2="209.4" stroke="#ffffff88" stroke-width="1" /><line x1="80" y1="240.8" x2="180" y2="240.8" stroke="#ffffff88" stroke-width="1" /><line x1="80" y1="272.2" x2="180" y2="272.2" stroke="#ffffff88" stroke-width="1" /><line x1="80" y1="303.6" x2="180" y2="303.6" stroke="#ffffff88" stroke-width="1" /><line x1="80" y1="335.0" x2="180" y2="335.0" stroke="#ffffff88" stroke-width="1" /><line x1="80" y1="366.4" x2="180" y2="366.4" stroke="#ffffff88" stroke-width="1" /><line x1="72" y1="332.0" x2="188" y2="332.0" stroke="#fff" stroke-width="4" /><text x="130" y="430" font-size="21" fill="#c981ae" text-anchor="middle" font-weight="bold">y = 0.70</text><text x="350" y="155" font-size="20" fill="#4b9fc4" text-anchor="middle" font-weight="bold">原头1</text><rect x="300" y="178" width="100" height="220" rx="5" fill="#4b9fc4" stroke="none"/><line x1="300" y1="209.4" x2="400" y2="209.4" stroke="#ffffff88" stroke-width="1" /><line x1="300" y1="240.8" x2="400" y2="240.8" stroke="#ffffff88" stroke-width="1" /><line x1="300" y1="272.2" x2="400" y2="272.2" stroke="#ffffff88" stroke-width="1" /><line x1="300" y1="303.6" x2="400" y2="303.6" stroke="#ffffff88" stroke-width="1" /><line x1="300" y1="335.0" x2="400" y2="335.0" stroke="#ffffff88" stroke-width="1" /><line x1="300" y1="366.4" x2="400" y2="366.4" stroke="#ffffff88" stroke-width="1" /><line x1="292" y1="244.0" x2="408" y2="244.0" stroke="#fff" stroke-width="4" /><text x="350" y="430" font-size="21" fill="#4b9fc4" text-anchor="middle" font-weight="bold">y = 0.30</text><text x="235" y="245" font-size="16" fill="#19324c" text-anchor="middle" font-weight="normal">argsort</text><text x="235" y="271" font-size="22" fill="#19324c" text-anchor="middle" font-weight="bold">[1, 0]</text><line x1="435" y1="287" x2="545" y2="287" stroke="#8094a9" stroke-width="2" /><path d="M 537 282 L 545 287 L 537 292" fill="none" stroke="#8094a9" stroke-width="2"/><text x="490" y="267" font-size="16" fill="#19324c" text-anchor="middle" font-weight="normal">同一排列</text><text x="635" y="155" font-size="20" fill="#4b9fc4" text-anchor="middle" font-weight="bold">上边界</text><rect x="585" y="178" width="100" height="220" rx="5" fill="#4b9fc4" stroke="none"/><line x1="585" y1="209.4" x2="685" y2="209.4" stroke="#ffffff88" stroke-width="1" /><line x1="585" y1="240.8" x2="685" y2="240.8" stroke="#ffffff88" stroke-width="1" /><line x1="585" y1="272.2" x2="685" y2="272.2" stroke="#ffffff88" stroke-width="1" /><line x1="585" y1="303.6" x2="685" y2="303.6" stroke="#ffffff88" stroke-width="1" /><line x1="585" y1="335.0" x2="685" y2="335.0" stroke="#ffffff88" stroke-width="1" /><line x1="585" y1="366.4" x2="685" y2="366.4" stroke="#ffffff88" stroke-width="1" /><line x1="577" y1="244.0" x2="693" y2="244.0" stroke="#fff" stroke-width="4" /><text x="635" y="430" font-size="21" fill="#4b9fc4" text-anchor="middle" font-weight="bold">y = 0.30</text><text x="855" y="155" font-size="20" fill="#c981ae" text-anchor="middle" font-weight="bold">下边界</text><rect x="805" y="178" width="100" height="220" rx="5" fill="#c981ae" stroke="none"/><line x1="805" y1="209.4" x2="905" y2="209.4" stroke="#ffffff88" stroke-width="1" /><line x1="805" y1="240.8" x2="905" y2="240.8" stroke="#ffffff88" stroke-width="1" /><line x1="805" y1="272.2" x2="905" y2="272.2" stroke="#ffffff88" stroke-width="1" /><line x1="805" y1="303.6" x2="905" y2="303.6" stroke="#ffffff88" stroke-width="1" /><line x1="805" y1="335.0" x2="905" y2="335.0" stroke="#ffffff88" stroke-width="1" /><line x1="805" y1="366.4" x2="905" y2="366.4" stroke="#ffffff88" stroke-width="1" /><line x1="797" y1="332.0" x2="913" y2="332.0" stroke="#fff" stroke-width="4" /><text x="855" y="430" font-size="21" fill="#c981ae" text-anchor="middle" font-weight="bold">y = 0.70</text><rect x="35" y="470" width="910" height="98" rx="12" fill="#f3f7fb" stroke="#dbe5ef"/><text x="49" y="497" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">排序沿“两个头”这一维执行，每个横向列可以有自己的排列。</text><text x="49" y="521" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">不仅交换坐标，整列64个场值也必须一起交换；每列内部的行次序保持不动。</text><text x="49" y="545" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">这样坐标监督、距离场监督、区域蒸馏都把同一组输出当成同一条边界。</text><text x="30" y="590" font-size="14" fill="#61758c" text-anchor="start" font-weight="normal">教学示意；尺寸与公式来自源码，图中数值例子不代表实际预测。</text></svg>