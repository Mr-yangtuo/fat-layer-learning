<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 665" width="980" height="665" role="img" aria-labelledby="title desc"><title id="title">蒸馏：学习教师曲线与区域，同时降低错误教师点的影响</title><desc id="desc">置信来自教师到人工标签的误差，并非教师自己输出的分类置信度。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="980" height="665" fill="white"/><text x="30" y="38" font-size="25" fill="#19324c" text-anchor="start" font-weight="bold">蒸馏：学习教师曲线与区域，同时降低错误教师点的影响</text><text x="30" y="67" font-size="16" fill="#61758c" text-anchor="start" font-weight="normal">置信来自教师到人工标签的误差，并非教师自己输出的分类置信度。</text><rect x="30" y="110" width="420" height="225" rx="12" fill="#f4f8fd" stroke="#dbe5ef"/><text x="48" y="140" font-size="20" fill="#19324c" text-anchor="start" font-weight="bold">教师和学生面对同一增强图像</text><rect x="65" y="167" width="90" height="100" rx="12" fill="#dbe6ef" stroke="#dbe5ef"/><path d="M65 201 Q95 185 155 210 M65 240 Q95 225 155 249" fill="none" stroke="#788da3" stroke-width="4"/><line x1="175" y1="190" x2="230" y2="190" stroke="#8094a9" stroke-width="2" /><path d="M 222 185 L 230 190 L 222 195" fill="none" stroke="#8094a9" stroke-width="2"/><line x1="175" y1="255" x2="230" y2="255" stroke="#8094a9" stroke-width="2" /><path d="M 222 250 L 230 255 L 222 260" fill="none" stroke="#8094a9" stroke-width="2"/><text x="246" y="196" font-size="17" fill="#3478d4" text-anchor="start" font-weight="normal">冻结教师：ResNet18</text><text x="246" y="261" font-size="16" fill="#259678" text-anchor="start" font-weight="normal">可训练学生：MobileNet</text><text x="48" y="313" font-size="16" fill="#19324c" text-anchor="start" font-weight="normal">教师不反向更新；人工标签始终监督学生。</text><rect x="480" y="110" width="470" height="225" rx="12" fill="#f9fafc" stroke="#dbe5ef"/><text x="498" y="140" font-size="20" fill="#19324c" text-anchor="start" font-weight="bold">逐点信任：以教师与标签误差判断</text><text x="498" y="185" font-size="17" fill="#19324c" text-anchor="start" font-weight="normal"> 0px</text><rect x="563" y="164" width="310" height="25" rx="3" fill="#5f9ed2" stroke="none"/><text x="910" y="184" font-size="16" fill="#19324c" text-anchor="middle" font-weight="normal">1.000</text><text x="498" y="238" font-size="17" fill="#19324c" text-anchor="start" font-weight="normal"> 8px</text><rect x="563" y="217" width="114" height="25" rx="3" fill="#5f9ed2" stroke="none"/><text x="910" y="237" font-size="16" fill="#19324c" text-anchor="middle" font-weight="normal">0.368</text><text x="498" y="291" font-size="17" fill="#19324c" text-anchor="start" font-weight="normal">16px</text><rect x="563" y="270" width="42" height="25" rx="3" fill="#5f9ed2" stroke="none"/><text x="910" y="290" font-size="16" fill="#19324c" text-anchor="middle" font-weight="normal">0.135</text><text x="498" y="313" font-size="17" fill="#19324c" text-anchor="start" font-weight="normal">gate = exp(−误差/8) × valid</text><rect x="30" y="365" width="920" height="211" rx="12" fill="#eff8f5" stroke="#dbe5ef"/><text x="48" y="397" font-size="20" fill="#19324c" text-anchor="start" font-weight="bold">蒸馏信号有两种</text><text x="48" y="431" font-size="18" fill="#19324c" text-anchor="start" font-weight="normal">① 坐标：学生曲线靠近教师曲线，使用带门控的Smooth L1。</text><text x="48" y="467" font-size="18" fill="#19324c" text-anchor="start" font-weight="normal">② 区域：场 d 经 sigmoid(d/0.025) 转成“位于边界下方”的概率。</text><text x="48" y="501" font-size="18" fill="#19324c" text-anchor="start" font-weight="normal">    用伯努利 KL 比较教师与学生软区域，系数为0.5。</text><text x="48" y="546" font-size="19" fill="#19324c" text-anchor="start" font-weight="bold">整项权重：0.488 × min(轮次/10,1)；前10轮逐步增加。</text><text x="40" y="612" font-size="16" fill="#61758c" text-anchor="start" font-weight="normal">门控表示位置之间的相对信任：加权平均会除以权重总和，不等于固定缩小整批损失。</text><text x="30" y="645" font-size="14" fill="#61758c" text-anchor="start" font-weight="normal">教学示意；尺寸与公式来自源码，图中数值例子不代表实际预测。</text></svg>